      ${previsionnel > 0 ? `<div class="barre-progres" style="height:12px;display:flex"><i style="width:${reel * 100 / previsionnel}%"></i><i style="width:${aFacturer * 100 / previsionnel}%;background:${ORC}"></i></div>

      ${grapheBarres("ca", [{ couleur: OR, valeurs: fac }, { couleur: ORC, valeurs: afac }], BILAN.moisCa, true)}

      <p class="note">${nomMois(BILAN.moisCa)} : ${euros(realise[BILAN.moisCa])} HT réalisés, dont ${euros(fac[BILAN.moisCa])} facturés et ${euros(afac[BILAN.moisCa])} à facturer</p>
    </div>

    <div class="section">Évolution du chiffre d’affaires cumulé</div>
    <div class="carte">
      ${grapheCourbes("cumul", courbes, BILAN.moisCumul)}
      ${legende([[OR, String(an)], [NEUTRE, String(an - 1)]].concat(projection ? [[ORC, "Projection"]] : []))}
      <p class="note">${vM !== null ? `Fin ${MOIS[BILAN.moisCumul]} : ${euros(vM)} HT réalisés (cumul)` : `Fin ${MOIS[BILAN.moisCumul]} : à venir`}, ${an - 1} : ${euros(pM || 0)}</p>
      ${evol !== null ? `<p class="note ${evol >= 0 ? "ok" : "ko"}">Évolution : ${evol >= 0 ? "+" : ""}${evol.toFixed(1).replace(".", ",")} % par rapport à ${an - 1}</p>` : ""}
      ${projection ? `<p class="note">Projection : ${euros(previsionnel)} HT fin décembre (facturé, temps à facturer et reste des missions).</p>` : ""}
    </div>

    <div class="section">TVA</div>
    <div class="carte">
      ${franchise ? `<p>Franchise en base : TVA non applicable sur vos factures et non récupérable sur vos achats.</p>` : `
      <div class="chiffres2"><div><div class="petit">TVA due</div><div class="v">${euros(somme(tvaDue))}</div></div><div><div class="petit">À recevoir (clients)</div><div class="v" style="color:#c46a00">${euros(somme(tvaRec))}</div></div><div><div class="petit">Récupérable</div><div class="v accent-t">${euros(somme(tvaDed))}</div></div></div>
      <p class="fort" style="margin:8px 0 2px">${somme(tvaDue) - somme(tvaDed) >= 0 ? `Solde ${an} : ${euros(somme(tvaDue) - somme(tvaDed))} à reverser` : `Solde ${an} : crédit de TVA de ${euros(somme(tvaDed) - somme(tvaDue))}`}</p>
      ${declaree + aDeclarer > 0 ? `<p class="note ${aDeclarer ? "ko" : ""}">Factures Chronéo : TVA déclarée ${euros(declaree)}, reste à déclarer ${euros(aDeclarer)}</p>` : ""}
      ${somme(tvaRec) ? `<p class="note">Les ${euros(somme(tvaRec))} « à recevoir » deviendront dus à l’encaissement (factures en attente et temps à facturer).</p>` : ""}
      ${grapheBarres("tva", [{ couleur: NEUTRE, valeurs: tvaDue }, { couleur: ORC, valeurs: tvaRec }, { couleur: OR, valeurs: tvaDed }], BILAN.moisTva, false)}
      ${legende([[NEUTRE, "Due"], [ORC, "À recevoir"], [OR, "Récupérable"]])}
      <p class="note">${nomMois(BILAN.moisTva)} : due ${euros(tvaDue[BILAN.moisTva])} − récupérable ${euros(tvaDed[BILAN.moisTva])} = ${tvaDue[BILAN.moisTva] - tvaDed[BILAN.moisTva] >= 0 ? euros(tvaDue[BILAN.moisTva] - tvaDed[BILAN.moisTva]) + " à payer" : "crédit " + euros(tvaDed[BILAN.moisTva] - tvaDue[BILAN.moisTva])}${tvaRec[BILAN.moisTva] ? ", à recevoir " + euros(tvaRec[BILAN.moisTva]) : ""}</p>
      <div class="fort" style="margin-top:14px">Cumul ${an}</div>
      ${grapheCourbes("tvacumul", [{ couleur: NEUTRE, valeurs: cDue }, { couleur: OR, valeurs: cDed }, { couleur: OR, valeurs: cRec, pointillee: true }], BILAN.moisTvaCumul)}
      ${legende([[NEUTRE, "Due"], [OR, "Récupérable"], [ORC, "À recevoir (pointillés)"]])}
      <p class="note">${cDue[BILAN.moisTvaCumul] !== null ? `Fin ${MOIS[BILAN.moisTvaCumul]} : due ${euros(cDue[BILAN.moisTvaCumul])}, récupérable ${euros(cDed[BILAN.moisTvaCumul] || 0)}, à recevoir ${euros(cRec[BILAN.moisTvaCumul] || 0)}` : `Fin ${MOIS[BILAN.moisTvaCumul]} : à venir`}</p>
      <p class="note">${debits ? "TVA due à l’émission des factures (option débits)." : "TVA due à l’encaissement (factures marquées payées)."} Temps facturés dans l’ancien outil : TVA estimée à ${depuisCentiemes(tauxTva)} % sur la valeur au TJM, au mois du temps.</p>`}
    </div>
    <p class="note" style="margin:16px 0">Indicatif : à rapprocher de votre comptabilité et de vos déclarations.</p>`);

  $$("[data-an]").forEach(b => b.onclick = () => { BILAN.annee += +b.dataset.an; rendre(); });
  $$("[data-mois]").forEach(r => r.onclick = () => {
    const cle = { ca: "moisCa", cumul: "moisCumul", tva: "moisTva", tvacumul: "moisTvaCumul" }[r.dataset.graphe];
    BILAN[cle] = +r.dataset.mois; rendre();
  });
}

  $("#base").onchange = ev => { const m = Math.round((parseFloat(ev.target.value.replace(",", ".")) || 8) * 60); r.baseMinutes = m > 0 ? m : 480; sauver(); toast("Base de travail : " + duree(r.baseMinutes) + " par jour"); };
  $("#gd").onchange = ev => { r.glisserDroite = ev.target.value; sauver(); };
  $("#gg").onchange = ev => { r.glisserGauche = ev.target.value; sauver(); };
  $("#ajout-intervenant").onclick = () => { const n = $("#nouvel-intervenant").value.trim(); if (!n) return; D.intervenants.push({ id: uid(), nom: n, actif: true }); sauver(); rendre(); };
  $$("[data-retirer]").forEach(b => b.onclick = () => {
    const i = intervenant(b.dataset.retirer);
    if (i.actif === false) i.actif = true;
    else if (D.saisies.some(s => s.intervenantId === i.id)) { i.actif = false; toast(i.nom + " désactivé (des temps lui sont rattachés)"); }
    else D.intervenants = D.intervenants.filter(x => x.id !== i.id);
    sauver(); rendre();
  });

  // Logo
  const majLogo = async () => {
    const z = $("#apercu-logo"); if (!z) return;
    if (r.logo === "aucun") { z.innerHTML = `<span class="petit">Aucun</span>`; return; }
    const b = r.logo === "perso" ? await Fichiers.lire("logo") : null;

  };
  majLogo();
  $("#logo").onchange = async ev => {
    const fi = ev.target.files[0]; if (!fi) return;
    try {
      const img = await createImageBitmap(fi), k = Math.min(1, 800 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(img.width * k)); cv.height = Math.max(1, Math.round(img.height * k));
      const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
      const jpeg = await new Promise(ok => cv.toBlob(ok, "image/jpeg", .92));   // JPEG sur fond blanc : compatible PDF/A-3
      await Fichiers.mettre("logo", jpeg); r.logo = "perso"; sauver(); majLogo(); toast("Logo enregistré");

  f.siret.addEventListener("input", () => { if (f.siret.value.replace(/\D/g, "").length === 14 && !f.siren.value) f.siren.value = f.siret.value.slice(0, 9); f.siren.dispatchEvent(new Event("input")); });
  f.franchiseTva.onchange = () => $("#bloc-tva").hidden = f.franchiseTva.checked;

  };
  f.prefixe.addEventListener("input", prochain); f.dernierNumeroReprise.addEventListener("input", prochain); prochain();
  $("#enreg-entreprise").onclick = () => {
    if (!repriseValide(f.dernierNumeroReprise.value)) { toast("Numéro de reprise invalide"); return; }
    ["raisonSociale", "siren", "siret", "tvaIntra", "adresse", "codePostal", "ville", "email", "telephone", "iban", "bic", "prefixe", "dernierNumeroReprise", "notePenalites", "noteIndemnite", "noteEscompte", "mentionsLegales"]
      .forEach(k => e[k] = f[k].value.trim());
    e.siren = e.siren.replace(/\D/g, ""); e.siret = e.siret.replace(/\D/g, ""); e.tvaIntra = e.tvaIntra.toUpperCase(); e.iban = e.iban.toUpperCase(); e.bic = e.bic.toUpperCase();
    e.prefixe = e.prefixe.replace(/[^A-Za-z0-9]/g, "").slice(0, 6) || "F";
    e.delaiPaiementJours = parseInt(f.delaiPaiementJours.value, 10) || 30;
    e.franchiseTva = f.franchiseTva.checked; e.tvaSurDebits = f.tvaSurDebits.checked; e.tauxTvaCentiemes = versCentiemes(f.taux.value) ?? 2000;
    sauver(); toast("Informations enregistrées");
  };

  OneDriveSync.brancherReglages();
  // Données
  $("#sauvegarder").onclick = async ev => {
    const b = ev.currentTarget; b.disabled = true; b.innerHTML = `<span class="chargement"></span> Préparation…`;
    try { const j = await sauvegardeAndroid(); await enregistrerFichier(`chroneo_sauvegarde_${isoJour()}.json`, JSON.stringify(j, null, 1), "application/json"); }
    catch (err) { toast("Échec : " + err.message); }
    b.disabled = false; b.textContent = "Créer une sauvegarde complète";
  };
  $("#restaurer").onchange = async ev => {
    const fi = ev.target.files[0]; if (!fi) return; ev.target.value = "";
    let j; try { j = JSON.parse(await fi.text()); } catch (err) { toast("Fichier illisible"); return; }
    if (j.format !== "GestionTemps-sauvegarde") { toast("Ce fichier n’est pas une sauvegarde Chronéo"); return; }
    const n = k => (j[k] || []).length;
    $("#restauration").innerHTML = `<div class="carte alerte"><div class="fort">Sauvegarde du ${echap(String(j.dateExport || "").slice(0, 16).replace("T", " "))}</div>
      <div class="petit">${n("clients")} client(s), ${n("missions")} mission(s), ${n("saisies")} temps, ${n("factures")} facture(s), ${n("achats")} achat(s)</div>
      <p class="note">Toutes les données de cet appareil seront remplacées.</p>
      <div class="boutons-ligne"><button type="button" class="btn danger" id="confirmer-restauration">Confirmer la restauration</button><button type="button" class="btn texte" id="annuler-restauration">Annuler</button></div></div>`;
    $("#annuler-restauration").onclick = () => $("#restauration").innerHTML = "";
    $("#confirmer-restauration").onclick = async () => { try { await restaurerAndroid(j); toast("Données restaurées"); rendre(); } catch (err) { console.error(err); toast("Échec de la restauration : " + err.message); } };
  };
  $("#importer").onchange = async ev => {
    const fi = ev.target.files[0]; if (!fi) return; ev.target.value = "";
    try { const n = importerTemps(JSON.parse(await fi.text())); toast(n + " temps importé(s)"); rendre(); } catch (err) { toast("Fichier non reconnu : " + err.message); }
  };
  $("#export-temps").onclick = () => enregistrerFichier(`chroneo_temps_${isoJour()}.json`, JSON.stringify(exportTemps(), null, 1), "application/json");
  $("#marquer").onclick = () => {
    const d = $("#jusqua").value; let n = 0;
    D.saisies.forEach(s => { if (statutDe(s) === "afacturer" && s.jour <= d) { s.statut = "ancien"; n++; } });
    sauver(); toast(n + " temps marqués comme facturés"); rendre();
  };
  $("#remettre").onclick = () => { let n = 0; D.saisies.forEach(s => { if (s.statut === "ancien") { s.statut = "afacturer"; n++; } }); sauver(); toast(n + " temps remis à facturer"); rendre(); };
  $("#effacer").onclick = async ev => {
    const b = ev.currentTarget;
    if (!b.dataset.arme) { b.dataset.arme = "1"; b.textContent = "Touchez à nouveau pour tout effacer (définitif)"; setTimeout(() => { if (b.isConnected) { delete b.dataset.arme; b.textContent = "Effacer toutes les données de cet appareil"; } }, 4000); return; }
    D = structuredClone(VIDE); sauver(); await Fichiers.vider(); toast("Données effacées"); rendre();
  };
}

// ------------------------------------------------------------ Sauvegarde au format de l'appli Android
async function sauvegardeAndroid() {
  const num = liste => new Map(liste.map((x, i) => [x.id, i + 1]));
  const nC = num(D.clients), nM = num(D.missions), nI = num(D.intervenants), nF = num(D.factures), nA = num(D.achats);
  const ep = iso => iso ? isoVersEpoch(iso) : null;
  const j = {
    format: "GestionTemps-sauvegarde", version: 1, dateExport: new Date().toISOString(),
    emetteur: { ...D.emetteur, minutesParJour: base() },
    clients: D.clients.map(c => ({ id: nC.get(c.id), nom: c.nom, siren: c.siren || "", tvaIntra: c.tvaIntra || "", adresse: c.adresse || "", codePostal: c.codePostal || "", ville: c.ville || "", pays: c.pays || "FR", email: c.email || "", tauxHoraireCents: 0, tauxJournalierCents: c.tjm || 0 })),
    intervenants: D.intervenants.map(i => ({ id: nI.get(i.id), nom: i.nom, actif: i.actif !== false })),
    missions: D.missions.filter(m => nC.has(m.clientId)).map(m => ({ id: nM.get(m.id), clientId: nC.get(m.clientId), nom: m.nom, description: m.description || "", dureePrevueCentiemesJour: m.prevuCentJours || 0, tauxHoraireCents: 0, terminee: !!m.terminee, tauxJournalierCents: m.tjm || 0 })),
    saisies: D.saisies.filter(s => nC.has(s.clientId)).map((s, i) => ({
      id: i + 1, clientId: nC.get(s.clientId), missionId: nM.get(s.missionId) ?? null, intervenantId: nI.get(s.intervenantId) ?? null, jour: s.jour,
      heureDebut: s.debut ?? null, heureFin: s.fin ?? null, minutes: s.minutes, description: s.description || "", tauxHoraireCents: Math.round(tjmSaisie(s) * 60 / base()),
      factureId: statutDe(s) === "facture" ? (nF.get(s.factureId) ?? null) : statutDe(s) === "ancien" ? -1 : statutDe(s) === "nonfact" ? -2 : null, pauseMinutes: s.pause || 0,
    })),

      jourEcheance: ep(f.jourEcheance), jourPaiement: ep(f.jourPaiement), totalHtCents: f.ht, totalTtcCents: f.ttc, avecAnnexe: !!f.avecAnnexe, jourDeclarationTva: ep(f.jourDeclarationTva) })),
    lignes: D.lignes.filter(l => nF.has(l.factureId)).map((l, i) => ({ id: i + 1, factureId: nF.get(l.factureId), ordre: l.ordre, libelle: l.libelle, quantiteCentiemes: l.qteCent, unite: l.unite, prixCents: l.prixCents, tauxTvaCentiemes: l.tvaCent, saisieId: null, missionId: nM.get(l.missionId) ?? null })),
    achats: D.achats.map(a => ({ id: nA.get(a.id), jour: a.jour, categorie: a.categorie, fournisseur: a.fournisseur || "", description: a.description || "", montantTtcCents: a.ttc || 0, tauxTvaCentiemes: a.tauxTva || 0, tvaRecuperable: !!a.recuperable, kilometres: a.km || 0, prixKmMilliemes: a.prixKmMil || 0, missionId: nM.get(a.missionId) ?? null })),
    justificatifs: [], pdfs: {}, logoMode: D.reglages.logo === "perso" ? "perso" : D.reglages.logo,
  };
  let k = 1;
  for (const x of D.justificatifs) { const b = await Fichiers.lire(x.fichier); if (b && nA.has(x.achatId)) j.justificatifs.push({ id: k++, achatId: nA.get(x.achatId), nom: x.nom, mime: x.mime, contenu: await blobVersB64(b) }); }
  for (const f of D.factures) { if (!f.pdf) continue; const b = await Fichiers.lire(f.pdf); if (b) j.pdfs[String(nF.get(f.id))] = await blobVersB64(b); }
  if (D.reglages.logo === "perso") { const b = await Fichiers.lire("logo"); if (b) j.logo = await blobVersB64(b); }
  return j;
}

async function restaurerAndroid(j) {

  if (j.emetteur) { nouv.emetteur = { ...EMETTEUR_DEFAUT }; Object.keys(EMETTEUR_DEFAUT).forEach(k => { if (j.emetteur[k] !== undefined) nouv.emetteur[k] = j.emetteur[k]; }); }
  nouv.clients = (j.clients || []).map(c => ({ id: id("c", c.id), nom: c.nom, siren: c.siren || "", tvaIntra: c.tvaIntra || "", adresse: c.adresse || "", codePostal: c.codePostal || "", ville: c.ville || "", pays: c.pays || "FR", email: c.email || "", tjm: c.tauxJournalierCents || 0 }));
  nouv.intervenants = (j.intervenants || []).map(i => ({ id: id("i", i.id), nom: i.nom, actif: i.actif !== false }));
  nouv.missions = (j.missions || []).map(m => ({ id: id("m", m.id), clientId: id("c", m.clientId), nom: m.nom, description: m.description || "", prevuCentJours: m.dureePrevueCentiemesJour || 0, tjm: m.tauxJournalierCents || 0, terminee: !!m.terminee }));
  nouv.saisies = (j.saisies || []).map(s => {
    const fid = s.factureId;
    return { id: id("s", s.id), clientId: id("c", s.clientId), missionId: id("m", s.missionId), intervenantId: id("i", s.intervenantId), jour: iso(s.jour),
      debut: s.heureDebut ?? null, fin: s.heureFin ?? null, pause: s.pauseMinutes || 0, minutes: s.minutes, description: s.description || "",
      statut: fid === null || fid === undefined ? "afacturer" : fid === -2 ? "nonfact" : fid === -1 ? "ancien" : "facture", factureId: fid > 0 ? id("f", fid) : undefined };
  });
  nouv.factures = (j.factures || []).map(f => ({ id: id("f", f.id), clientId: id("c", f.clientId), numero: f.numero || null, statut: f.statut, jourCreation: iso(f.jourCreation), jourEmission: iso(f.jourEmission),
    jourEcheance: iso(f.jourEcheance), jourPaiement: iso(f.jourPaiement), jourDeclarationTva: iso(f.jourDeclarationTva), ht: f.totalHtCents || 0, ttc: f.totalTtcCents || 0, avecAnnexe: f.avecAnnexe !== false,
    pdf: j.pdfs && j.pdfs[String(f.id)] ? "pdf-" + id("f", f.id) : undefined }));
  nouv.lignes = (j.lignes || []).map(l => ({ id: id("l", l.id), factureId: id("f", l.factureId), ordre: l.ordre || 0, libelle: l.libelle, qteCent: l.quantiteCentiemes, unite: l.unite, prixCents: l.prixCents, tvaCent: l.tauxTvaCentiemes, missionId: id("m", l.missionId) }));
  nouv.achats = (j.achats || []).map(a => ({ id: id("a", a.id), jour: iso(a.jour), categorie: a.categorie || "ACHAT", fournisseur: a.fournisseur || "", description: a.description || "", ttc: a.montantTtcCents || 0, tauxTva: a.tauxTvaCentiemes || 0, recuperable: !!a.tvaRecuperable, km: a.kilometres || 0, prixKmMil: a.prixKmMilliemes || 0, missionId: id("m", a.missionId) }));
  // Fichiers
  await Fichiers.vider();
  for (const f of j.factures || []) { const b64 = j.pdfs && j.pdfs[String(f.id)]; if (b64) await Fichiers.mettre("pdf-" + id("f", f.id), b64VersBlob(b64, "application/pdf")); }
  nouv.justificatifs = [];
  for (const x of j.justificatifs || []) { const cle = "j-" + id("j", x.id); await Fichiers.mettre(cle, b64VersBlob(x.contenu, x.mime || "application/octet-stream")); nouv.justificatifs.push({ id: id("j", x.id), achatId: id("a", x.achatId), nom: x.nom, mime: x.mime, fichier: cle }); }
  if (j.logo) await Fichiers.mettre("logo", b64VersBlob(j.logo, "image/jpeg")); else if (nouv.reglages.logo === "perso") nouv.reglages.logo = "defaut";
  void tjmSec;
  D = nouv; sauver();
}

// ------------------------------------------------------------ Extraction et import de temps
function exportTemps() {
  return { format: "GestionTemps-temps", source: NOM_APPLI + " web", genereLe: new Date().toISOString(), baseMinutesParJour: base(),
    temps: D.saisies.slice().sort((a, b) => a.jour.localeCompare(b.jour)).map(s => ({
      date: s.jour, heureDebut: s.debut != null ? texteHeure(s.debut) : null, heureFin: s.fin != null ? texteHeure(s.fin) : null, pauseMinutes: s.pause || 0, dureeMinutes: s.minutes,
      intervenant: intervenant(s.intervenantId)?.nom || null, client: client(s.clientId)?.nom || "?", mission: mission(s.missionId)?.nom || "Général", description: s.description || "",
      tjmHT: tjmSaisie(s) / 100, montantHT: valeur(s) / 100, facturable: statutDe(s) !== "nonfact",
      facture: statutDe(s) === "facture" ? (facture(s.factureId)?.numero || "brouillon") : statutDe(s) === "ancien" ? "ancien outil" : null })) };
}
/* Ajout de temps : extraction (« GestionTemps-temps ») ou sauvegarde de la première version web. Rapprochement par nom, doublons ignorés. */
function importerTemps(j) {
  const cle = s => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
  const trouverClient = (nom, tjm) => { let c = D.clients.find(x => cle(x.nom) === cle(nom)); if (!c) { c = { id: uid(), nom: String(nom).trim(), tjm: tjm || 0, pays: "FR" }; D.clients.push(c); } else if (!c.tjm && tjm) c.tjm = tjm; return c; };
  const trouverMission = (c, nom, extra) => { let m = D.missions.find(x => x.clientId === c.id && cle(x.nom) === cle(nom)); if (!m) { m = { id: uid(), clientId: c.id, nom: String(nom).trim(), prevuCentJours: 0, tjm: 0, terminee: false, ...(extra || {}) }; D.missions.push(m); } return m; };
  const trouverInterv = nom => { if (!nom) return null; let i = D.intervenants.find(x => cle(x.nom) === cle(nom)); if (!i) { i = { id: uid(), nom: String(nom).trim(), actif: true }; D.intervenants.push(i); } return i; };
  const doublon = s => D.saisies.some(x => x.jour === s.jour && x.debut === s.debut && x.minutes === s.minutes && x.missionId === s.missionId);
  let n = 0; const ajouter = s => { if (!doublon(s)) { D.saisies.push(s); n++; } };
  if (j.format === "GestionTemps-temps") {
    (j.temps || []).forEach(t => {
      const c = trouverClient(t.client || "?"), m = trouverMission(c, t.mission || "Général"), i = trouverInterv(t.intervenant);
      const d = t.heureDebut ? versMinutes(t.heureDebut) : null, fi = t.heureFin ? versMinutes(t.heureFin) : null;
      ajouter({ id: uid(), jour: t.date, debut: d, fin: fi, pause: t.pauseMinutes || 0, minutes: t.dureeMinutes ?? (fi - d - (t.pauseMinutes || 0)), missionId: m.id, clientId: c.id,
        intervenantId: i?.id || null, description: t.description || "", statut: t.facturable === false ? "nonfact" : t.facture ? "ancien" : "afacturer" });
    });
  } else if (j.format === "Chroneo-web" && j.donnees) {
    const w = j.donnees, cs = {}, ms = {}, is = {};
    (w.clients || []).forEach(c => cs[c.id] = trouverClient(c.nom, c.tjm));
    (w.intervenants || []).forEach(i => is[i.id] = trouverInterv(i.nom));
    (w.missions || []).forEach(m => { if (cs[m.clientId]) ms[m.id] = trouverMission(cs[m.clientId], m.nom, { prevuCentJours: m.prevuCentJours, tjm: m.tjm, terminee: m.terminee }); });
    (w.saisies || []).forEach(s => { const m = ms[s.missionId]; if (m) ajouter({ ...s, id: uid(), missionId: m.id, clientId: m.clientId, intervenantId: is[s.intervenantId]?.id || null }); });
  } else if (j.format === "GestionTemps-sauvegarde") throw new Error("c’est une sauvegarde complète : utilisez « Restaurer une sauvegarde »");
  else throw new Error("format inconnu");
  sauver(); return n;
}

/* ===== app-onedrive.js ===== */
/* =====================================================================
   Chronéo web – synchronisation OneDrive (API Microsoft Graph)
   Même fichier et même format que l'appli Android : OneDrive/<dossier>/chroneo-donnees.json
   (sauvegarde complète « GestionTemps-sauvegarde »). Connexion OAuth 2.0 + PKCE dans le navigateur.
   ===================================================================== */
const OneDriveSync = (() => {
  const CLE_OD = "chroneo.onedrive.v1";
  const AUTORITE = "https://login.microsoftonline.com/common/oauth2/v2.0";
  const GRAPH = "https://graph.microsoft.com/v1.0";
  const PORTEES = "offline_access Files.ReadWrite User.Read";
  const NOM_FICHIER = "chroneo-donnees.json";
  const P = Object.assign({ clientId: "", dossier: "Chronéo", acces: "", expire: 0, refresh: "", compte: "", actif: false, derniereDate: "", derniereEcriture: "", erreur: "" }, lire(CLE_OD, {}));
  const sauverP = () => ecrire(CLE_OD, P);
  let minuteur = 0, enAttente = false, ignorerJusqua = 0, enCours = false;

  const b64url = octets => btoa(String.fromCharCode(...octets)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const redirection = () => location.origin + location.pathname;
  const chemin = () => (P.dossier || "Chronéo").trim().replace(/^\/+|\/+$/g, "") + "/" + NOM_FICHIER;
  const urlFichier = () => GRAPH + "/me/drive/root:/" + chemin().split("/").map(encodeURIComponent).join("/") + ":/content";

  // ---------------------------------------------------------------- Connexion
  async function connecter() {
    if (!P.clientId) throw new Error("Saisissez d’abord l’ID d’application Azure");
    const verificateur = b64url(crypto.getRandomValues(new Uint8Array(48)));
    const defi = b64url(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verificateur))));
    const etat = b64url(crypto.getRandomValues(new Uint8Array(16)));
    sessionStorage.setItem("chroneo.od.pkce", JSON.stringify({ verificateur, etat, hash: location.hash }));
    location.href = `${AUTORITE}/authorize?client_id=${encodeURIComponent(P.clientId)}&response_type=code&redirect_uri=${encodeURIComponent(redirection())}` +
      `&response_mode=query&scope=${encodeURIComponent(PORTEES)}&code_challenge=${defi}&code_challenge_method=S256&state=${etat}&prompt=select_account`;
  }
  async function jetons(champs) {
    const rep = await fetch(AUTORITE + "/token", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams(champs) });
    const j = await rep.json().catch(() => ({}));
    if (!rep.ok) throw new Error((j.error_description || "HTTP " + rep.status).split("\r")[0]);
    P.acces = j.access_token; P.expire = Date.now() + (j.expires_in || 3600) * 1000; if (j.refresh_token) P.refresh = j.refresh_token; sauverP();
  }
  /** Au démarrage : traite le retour de la page de connexion Microsoft (?code=…). */
  async function traiterRetour() {
    const q = new URLSearchParams(location.search);
    if (!q.has("code") && !q.has("error")) return false;
    const pk = JSON.parse(sessionStorage.getItem("chroneo.od.pkce") || "{}");
    history.replaceState(history.state, "", location.pathname + (pk.hash || "#reglages"));
    sessionStorage.removeItem("chroneo.od.pkce");
    try {
      if (q.has("error")) throw new Error(q.get("error_description") || q.get("error"));
      if (q.get("state") !== pk.etat) throw new Error("réponse de connexion inattendue");
      await jetons({ client_id: P.clientId, grant_type: "authorization_code", code: q.get("code"), redirect_uri: redirection(), code_verifier: pk.verificateur, scope: PORTEES });
      const moi = await (await fetch(GRAPH + "/me", { headers: { Authorization: "Bearer " + P.acces } })).json();
      P.compte = moi.mail || moi.userPrincipalName || ""; P.erreur = ""; sauverP();
      toast("Connecté à OneDrive : " + P.compte);
    } catch (e) { P.erreur = "Connexion OneDrive impossible : " + e.message; sauverP(); toast(P.erreur); }
    return true;
  }
  async function jeton() {
    if (P.acces && P.expire > Date.now() + 60000) return P.acces;
    if (!P.refresh) throw Object.assign(new Error("Reconnexion à OneDrive nécessaire"), { reconnexion: true });
    try { await jetons({ client_id: P.clientId, grant_type: "refresh_token", refresh_token: P.refresh, scope: PORTEES }); return P.acces; }
    catch (e) { P.refresh = ""; P.acces = ""; sauverP(); throw Object.assign(new Error("Reconnexion à OneDrive nécessaire"), { reconnexion: true }); }
  }
  function deconnecter() { Object.assign(P, { acces: "", refresh: "", expire: 0, compte: "", actif: false, erreur: "" }); sauverP(); }

  // ---------------------------------------------------------------- Fichier
  async function envoyer(texte) {
    const rep = await fetch(urlFichier(), { method: "PUT", headers: { Authorization: "Bearer " + await jeton(), "Content-Type": "application/json" }, body: texte });
    if (!rep.ok) throw new Error(rep.status === 507 ? "espace OneDrive insuffisant" : "OneDrive : erreur " + rep.status);
  }
  async function telecharger() {
    const rep = await fetch(urlFichier(), { headers: { Authorization: "Bearer " + await jeton() } });
    if (rep.status === 404) return null;
    if (!rep.ok) throw new Error("OneDrive : erreur " + rep.status);
    const t = await rep.text(); return t.trim() ? t : null;
  }

  // ---------------------------------------------------------------- Synchronisation
  async function ecrireMaintenant() {
    if (!P.actif || enCours) return;
    enCours = true; clearTimeout(minuteur);
    try {
      const j = await sauvegardeAndroid(); await envoyer(JSON.stringify(j));
      P.derniereDate = j.dateExport; P.derniereEcriture = new Date().toISOString(); P.erreur = ""; enAttente = false;
    } catch (e) { P.erreur = e.reconnexion ? "Reconnexion à OneDrive nécessaire (Réglages)" : "Échec de l’envoi vers OneDrive : " + e.message; }
    sauverP(); enCours = false; majBandeau();
  }
  /** Appelé à chaque enregistrement : envoi quelques secondes après la dernière modification. */
  function planifier() {
    if (!P.actif || Date.now() < ignorerJusqua) return;
    enAttente = true; clearTimeout(minuteur); minuteur = setTimeout(ecrireMaintenant, 8000);
  }
  /** Renvoie le contenu distant s'il diffère de la dernière version écrite ou chargée par cet appareil. */
  async function modifieAilleurs() {
    if (!P.actif) return null;
    try { const t = await telecharger(); if (!t) return null; const d = JSON.parse(t).dateExport; return d && d !== P.derniereDate ? t : null; }
    catch (e) { P.erreur = e.reconnexion ? "Reconnexion à OneDrive nécessaire (Réglages)" : e.message; sauverP(); return null; }
  }
  async function charger(texte) {
    const j = JSON.parse(texte);
    if (j.format !== "GestionTemps-sauvegarde") throw new Error("ce fichier n’est pas un fichier de données Chronéo");
    ignorerJusqua = Date.now() + 4000;
    await restaurerAndroid(j);
    P.derniereDate = j.dateExport; P.erreur = ""; enAttente = false; clearTimeout(minuteur); sauverP();
  }
  async function activer() {
    P.actif = true; P.derniereDate = ""; sauverP();
    const t = await telecharger();            // fichier déjà présent (créé par Android ou un autre appareil) ?
    if (t) return t;
    await ecrireMaintenant(); return null;
  }

  // ---------------------------------------------------------------- Bandeau (version différente, reconnexion)
  let distant = null;
  function majBandeau() {
    const z = $("#bandeau"); if (!z) return;
    if (distant) {
      let resume = ""; try { const j = JSON.parse(distant); resume = `version du ${String(j.dateExport || "").slice(0, 16).replace("T", " ")} : ${(j.saisies || []).length} temps, ${(j.factures || []).length} facture(s)`; } catch (e) { /* */ }
      z.innerHTML = `<div class="carte accent" style="margin:12px 16px 0"><div class="fort">Données modifiées sur un autre appareil</div><div class="petit">${echap(resume)}</div>
        <div class="boutons-ligne"><button class="btn" id="od-charger">Charger le fichier OneDrive</button><button class="btn contour" id="od-garder">Garder cet appareil</button></div></div>`;
      $("#od-charger").onclick = async () => { try { await charger(distant); distant = null; toast("Données chargées depuis OneDrive"); majBandeau(); rendre(); } catch (e) { toast("Échec : " + e.message); } };
      $("#od-garder").onclick = async () => { distant = null; majBandeau(); await ecrireMaintenant(); toast("OneDrive mis à jour avec cet appareil"); };
    } else if (P.actif && P.erreur.startsWith("Reconnexion")) {
      z.innerHTML = `<div class="carte alerte" style="margin:12px 16px 0;display:flex;gap:10px;align-items:center"><span style="flex:1" class="petit">OneDrive : reconnexion nécessaire pour continuer la synchronisation.</span><button class="btn" id="od-reco">Reconnecter</button></div>`;
      $("#od-reco").onclick = () => connecter().catch(e => toast(e.message));
    } else z.innerHTML = "";
  }
  async function demarrer() {
    await traiterRetour();
    if (P.actif) { distant = await modifieAilleurs(); majBandeau(); }
    document.addEventListener("visibilitychange", async () => {
      if (document.hidden) { if (enAttente) ecrireMaintenant(); }
      else if (P.actif && !enAttente) { const t = await modifieAilleurs(); if (t) { distant = t; majBandeau(); } }
    });
  }

  // ---------------------------------------------------------------- Section des réglages
  function sectionReglages() {
    const ok = !!P.refresh || (P.acces && P.expire > Date.now());
    return `<div class="section">OneDrive (fichier de données partagé avec l’appli Android)</div>
      <label class="champ"><span>ID d’application Azure (client)</span><input id="od-client" value="${echap(P.clientId)}" autocomplete="off"></label>
      <label class="champ"><span>Dossier dans OneDrive</span><input id="od-dossier" value="${echap(P.dossier)}"></label>
      <p class="note">Fichier : ${echap(chemin())}. Dans Azure, déclarez la plateforme <b>« Application monopage (SPA) »</b> avec l’URI de redirection : <b>${echap(redirection())}</b></p>
      ${P.erreur ? `<p class="note ko">${echap(P.erreur)}</p>` : ""}
      ${ok ? `<p class="note ok">Connecté : ${echap(P.compte)}${P.actif ? ", synchronisation active" + (P.derniereEcriture ? ", dernier envoi le " + echap(P.derniereEcriture.slice(0, 16).replace("T", " ")) : "") : ""}</p>` : ""}
      <div class="boutons-ligne">
        ${!ok ? `<button type="button" class="btn" id="od-connecter">Se connecter à Microsoft</button>` : ""}
        ${ok && !P.actif ? `<button type="button" class="btn" id="od-activer">Utiliser OneDrive pour mes données</button>` : ""}
        ${ok && P.actif ? `<button type="button" class="btn contour" id="od-envoyer">Envoyer maintenant</button><button type="button" class="btn contour" id="od-recharger">Charger depuis OneDrive</button>` : ""}
      </div>
      ${ok ? `<button type="button" class="btn texte erreur-t" id="od-deconnecter">Se déconnecter de Microsoft</button>` : ""}
      <div id="od-proposition"></div>`;
  }
  function brancherReglages() {
    const ci = $("#od-client"); if (!ci) return;
    ci.onchange = () => { P.clientId = ci.value.trim(); sauverP(); };
    $("#od-dossier").onchange = e => { P.dossier = e.target.value.trim() || "Chronéo"; sauverP(); rendre(); };
    const b = id => $(id);
    if (b("#od-connecter")) b("#od-connecter").onclick = () => { P.clientId = ci.value.trim(); sauverP(); connecter().catch(e => toast(e.message)); };
    if (b("#od-activer")) b("#od-activer").onclick = async () => {
      try {
        const t = await activer();
        if (t) proposer(t); else { toast("Données envoyées vers OneDrive"); rendre(); }
      } catch (e) { toast("OneDrive : " + e.message); rendre(); }
    };
    if (b("#od-envoyer")) b("#od-envoyer").onclick = async () => { await ecrireMaintenant(); toast(P.erreur || "OneDrive à jour"); rendre(); };
    if (b("#od-recharger")) b("#od-recharger").onclick = async () => { try { const t = await telecharger(); if (t) proposer(t); else toast("Aucun fichier dans OneDrive"); } catch (e) { toast(e.message); } };
    if (b("#od-deconnecter")) b("#od-deconnecter").onclick = () => { deconnecter(); rendre(); };
  }
  function proposer(texte) {
    let resume = ""; try { const j = JSON.parse(texte); resume = `Version du ${String(j.dateExport || "").slice(0, 16).replace("T", " ")} : ${(j.clients || []).length} client(s), ${(j.saisies || []).length} temps, ${(j.factures || []).length} facture(s)`; } catch (e) { /* */ }
    $("#od-proposition").innerHTML = `<div class="carte accent"><div class="fort">Le fichier OneDrive contient déjà des données</div><div class="petit">${echap(resume)}</div>
      <div class="boutons-ligne"><button type="button" class="btn" id="od-p-charger">Charger ces données (remplace cet appareil)</button><button type="button" class="btn contour" id="od-p-ecraser">Écraser avec cet appareil</button></div></div>`;
    $("#od-p-charger").onclick = async () => { try { await charger(texte); toast("Données chargées depuis OneDrive"); rendre(); } catch (e) { toast("Échec : " + e.message); } };
    $("#od-p-ecraser").onclick = async () => { await ecrireMaintenant(); toast("OneDrive mis à jour avec cet appareil"); rendre(); };
  }

  return { planifier, demarrer, sectionReglages, brancherReglages, ecrireMaintenant };
})();

/* ===== démarrage ===== */
appliquerTheme();
history.replaceState({ ecran: 0 }, "");
rendre();
OneDriveSync.demarrer().then(() => rendre());
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
