<style>
:root {
  --graphite: #292929;
  --orange: #FF8000;
  --accent: #B85400;          /* orange lisible sur fond clair */
  --fond: #F6F6F4;
  --surface: #FFFFFF;
  --surface-2: #EFEDEA;
  --texte: #292929;
  --texte-2: #5C5A57;
  --trait: #DEDBD6;
  --barre: #292929;
  --sur-barre: #FFFFFF;
  --erreur: #BA1A1A;
  --pause: rgba(255, 128, 0, .22);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: #FF9A3D; --fond: #141414; --surface: #1F1F1F; --surface-2: #2A2A2A;
    --texte: #EDEDED; --texte-2: #BDBBB8; --trait: #353535; --barre: #1C1C1C; --sur-barre: #EDEDED;
    --erreur: #FFB4AB; --pause: rgba(255, 128, 0, .28); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --accent: #FF9A3D; --fond: #141414; --surface: #1F1F1F; --surface-2: #2A2A2A;
  --texte: #EDEDED; --texte-2: #BDBBB8; --trait: #353535; --barre: #1C1C1C; --sur-barre: #EDEDED;
  --erreur: #FFB4AB; --pause: rgba(255, 128, 0, .28); color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100%; background: var(--fond); color: var(--texte);
  font: 16px/1.4 "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--barre); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

/* ---------- Barre de titre ---------- */
.barre {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  background: var(--barre); color: var(--sur-barre);
}
.barre h1 { margin: 0; font-size: 20px; font-weight: 600; flex: 1; }
.barre .retour { background: none; border: 0; color: var(--sur-barre); font-size: 26px; line-height: 1; padding: 0 6px 0 0; }
.barre .action { background: none; border: 0; color: var(--orange); font-weight: 600; font-size: 16px; padding: 6px 4px; }
.barre .action:disabled { opacity: .4; }
.logo { width: 30px; height: 30px; flex: none; }

main { max-width: 620px; margin: 0 auto; padding: 0 16px 120px; }

/* ---------- Navigation ---------- */
.onglets {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex; justify-content: center; gap: 4px;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--trait);
}
.onglets a {
  flex: 1; max-width: 160px; text-align: center; text-decoration: none; color: var(--texte-2);
  padding: 8px 4px; border-radius: 12px; font-weight: 500;
}
.onglets a[aria-current="page"] { color: var(--texte); background: var(--pause); font-weight: 600; }

/* ---------- Chrono : l'anneau orange du logo devient le cadran ---------- */
.chrono {
  margin-top: 16px; padding: 18px 18px 16px; border-radius: 22px;
  background: var(--graphite); color: #F2F2F2;
}
.chrono.actif { background: var(--orange); color: var(--graphite); }
.chrono.pause { background: var(--graphite); }
.cadran { display: grid; place-items: center; position: relative; width: 210px; height: 210px; margin: 4px auto 10px; }
.cadran svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.cadran .fond-anneau { stroke: rgba(255,255,255,.14); }
.chrono.actif .cadran .fond-anneau { stroke: rgba(41,41,41,.18); }
.cadran .anneau { stroke: var(--orange); transition: stroke-dashoffset .8s linear; }
.chrono.actif .cadran .anneau { stroke: var(--graphite); }
.temps-ecoule { font-size: 44px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .5px; }
.sous-cadran { font-size: 14px; opacity: .8; text-align: center; margin-top: -2px; }
.chrono select {
  width: 100%; margin: 4px 0; padding: 10px 12px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,.25); background: transparent; color: inherit;
}
.chrono select option { color: #292929; }
.chrono .boutons { display: flex; gap: 10px; margin-top: 10px; }
.chrono .boutons button { flex: 1; }

/* ---------- Boutons ---------- */
.btn { border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 600; background: var(--orange); color: var(--graphite); }
.btn:disabled { opacity: .45; }
.btn.sombre { background: var(--graphite); color: #fff; }
.btn.contour { background: transparent; color: inherit; border: 1.5px solid currentColor; }
.btn.texte { background: none; color: var(--accent); padding: 10px 4px; }
.btn.danger { background: none; color: var(--erreur); border: 1.5px solid var(--erreur); }
.btn.large { width: 100%; }

/* ---------- Filtres ---------- */
.puces { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: none; }
.puce {
  flex: none; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--trait);
  background: var(--surface); color: var(--texte); font-size: 14px; font-weight: 500;
}
.puce[aria-pressed="true"] { background: var(--graphite); border-color: var(--graphite); color: #fff; }
:root[data-theme="dark"] .puce[aria-pressed="true"] { background: var(--orange); color: var(--graphite); border-color: var(--orange); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .puce[aria-pressed="true"] { background: var(--orange); color: var(--graphite); border-color: var(--orange); } }
.periode { display: flex; align-items: center; gap: 4px; }
.periode button { background: none; border: 0; font-size: 26px; padding: 2px 12px; color: var(--texte); }
.periode .titre { flex: 1; text-align: center; font-weight: 600; }
.periode .aujourdhui { display: block; font-size: 13px; color: var(--accent); background: none; border: 0; margin: 0 auto; }

.resume { display: flex; justify-content: space-between; gap: 12px; margin: 10px 0 4px; }
.resume .grand { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.resume .petit { font-size: 13px; color: var(--texte-2); }
.resume .droite { text-align: right; }
.resume .droite .grand { color: var(--accent); }

/* ---------- Liste des temps ---------- */
.groupe { display: flex; justify-content: space-between; gap: 8px; margin: 18px 0 6px; font-weight: 600; font-size: 15px; }
.groupe span:last-child { font-variant-numeric: tabular-nums; }
.glisse { position: relative; margin: 6px 0; touch-action: pan-y; }
.glisse .fond-action {
  position: absolute; inset: 0; border-radius: 16px; display: flex; align-items: center; padding: 0 20px;
  font-weight: 600; color: var(--graphite); background: var(--orange); opacity: 0;
}
.glisse .fond-action.gauche { justify-content: flex-end; }
.glisse .fond-action.danger { background: var(--erreur); color: #fff; }
.ligne {
  position: relative; display: flex; gap: 12px; align-items: center; width: 100%; text-align: left;
  padding: 12px 14px; border-radius: 16px; border: 1px solid var(--trait); background: var(--surface);
  transition: transform .25s ease;
}
.glisse.en-cours .ligne { transition: none; }
.ligne .corps { flex: 1; min-width: 0; }
.ligne .titre { font-weight: 600; }
.ligne .mission { color: var(--accent); font-size: 15px; }
.ligne .infos { font-size: 13px; color: var(--texte-2); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ligne .desc { font-size: 13px; color: var(--texte-2); white-space: pre-line; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ligne .statut { font-size: 12px; color: var(--accent); font-weight: 600; }
.ligne .chiffres { text-align: right; font-variant-numeric: tabular-nums; }
.ligne .chiffres b { display: block; }
.ligne .chiffres small { color: var(--texte-2); }
.etiquette-pause { background: var(--pause); color: var(--texte); border-radius: 6px; padding: 1px 6px; font-weight: 600; font-size: 12px; }
.vide { margin: 32px 0; text-align: center; color: var(--texte-2); }
.fab {
  position: fixed; right: max(16px, calc(50% - 294px)); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); z-index: 4;
  width: 58px; height: 58px; border-radius: 18px; border: 0; font-size: 30px; line-height: 1;
  background: var(--orange); color: var(--graphite); box-shadow: 0 6px 16px rgba(0,0,0,.25);
}

/* ---------- Formulaires (plein écran) ---------- */
.section { display: flex; align-items: center; gap: 8px; margin: 22px 0 8px; font-weight: 600; }
.section::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--orange); }
label.champ { display: block; margin: 8px 0; }
label.champ > span { display: block; font-size: 13px; color: var(--texte-2); margin-bottom: 4px; }
label.champ input, label.champ select, label.champ textarea {
  width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--trait); background: var(--surface);
}
label.champ textarea { min-height: 84px; resize: vertical; }
.deux { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.trois { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.note { font-size: 13px; color: var(--texte-2); margin: 6px 0; }
.note.ok { color: var(--accent); font-weight: 600; }
.note.ko { color: var(--erreur); }
.carte { background: var(--surface); border: 1px solid var(--trait); border-radius: 16px; padding: 14px; margin: 8px 0; }
.carte .entete { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
.barre-progres { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin: 8px 0 4px; }
.barre-progres i { display: block; height: 100%; background: var(--orange); }
.barre-progres.depasse i { background: var(--erreur); }
.interrupteur { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 0; }
.interrupteur input { width: 22px; height: 22px; accent-color: var(--orange); }

/* ---------- Message en bas ---------- */
.toast {
  position: fixed; left: 50%; transform: translate(-50%, 20px); bottom: calc(150px + env(safe-area-inset-bottom, 0px));
  z-index: 20; display: flex; gap: 14px; align-items: center; max-width: calc(100% - 32px);
  padding: 12px 16px; border-radius: 14px; background: #292929; color: #fff;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.visible { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { background: none; border: 0; color: var(--orange); font-weight: 700; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- Ajouts version complète ---------- */
.barre .icone { background: none; border: 0; color: var(--sur-barre); font-size: 22px; padding: 4px 6px; line-height: 1; }
.onglets a { font-size: 13px; padding: 6px 2px 5px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.onglets svg { width: 22px; height: 22px; }
.carte.cliquable { display: block; width: 100%; text-align: left; color: inherit; }
.carte.accent { background: var(--pause); border-color: transparent; }
.carte.alerte { border-color: var(--erreur); }
.ligne-simple { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--trait); }
.ligne-simple:last-child { border-bottom: 0; }
.ligne-simple .g { flex: 1; min-width: 0; }
.petit { font-size: 13px; color: var(--texte-2); }
.fort { font-weight: 600; }
.accent-t { color: var(--accent); }
.erreur-t { color: var(--erreur); }
.chiffres2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
.chiffres2 .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.legende { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; margin-top: 6px; }
.legende i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.graphe { width: 100%; height: auto; display: block; touch-action: pan-y; }
.case { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.case input { width: 20px; height: 20px; accent-color: var(--orange); flex: none; }
.boutons-ligne { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.boutons-ligne .btn { flex: 1; }
.apercu-logo { width: 84px; height: 84px; border-radius: 12px; background: #fff; border: 1px solid var(--trait); display: grid; place-items: center; overflow: hidden; }
.apercu-logo img { max-width: 76px; max-height: 76px; }
.entete-marque { display: flex; align-items: center; gap: 14px; margin: 18px 0 4px; }
.entete-marque .nom { font-size: 26px; font-weight: 700; }
.entete-marque .st { font-size: 13px; color: var(--texte-2); }
.chargement { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--orange); border-right-color: transparent; border-radius: 50%; animation: tourne .8s linear infinite; vertical-align: -3px; }
@keyframes tourne { to { transform: rotate(360deg); } }
.statut-p { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); }
.statut-p.retard { background: var(--erreur); color: #fff; }
.statut-p.payee { background: var(--pause); }
</style>

/* =====================================================================
   Chronéo – logique métier (identique à l'appli Android)
   Montants en centimes (entiers), quantités en centièmes, taux en centièmes de %.
   ===================================================================== */
const NOM_APPLI = "Chronéo";
const SOUS_TITRE_APPLI = "BIRDYEYES Solutions - Gestion des temps et de la facturation";
const MENTION_FRANCHISE = "TVA non applicable, art. 293 B du CGI";

/** Arrondi « au demi supérieur » d'une division entière (a / b), a et b positifs ou négatifs. */
function divArrondi(a, b) { const s = Math.sign(a) * Math.sign(b) || 1; return s * Math.floor((Math.abs(a) + Math.abs(b) / 2) / Math.abs(b)); }

/** Montant d'une ligne : quantité (centièmes) x prix unitaire (centimes), arrondi au centime. */
const montantLigne = l => divArrondi(l.qteCent * l.prixCents, 100);

/** Totaux EN 16931 : TVA calculée par taux sur la base cumulée. */
function calculerTotaux(lignes, franchise) {
  const montants = lignes.map(montantLigne);
  const bases = new Map();
  lignes.forEach((l, i) => { const t = franchise ? 0 : l.tvaCent; bases.set(t, (bases.get(t) || 0) + montants[i]); });
  const ventilation = [...bases.entries()].map(([taux, base]) => ({ taux, base, montant: divArrondi(base * taux, 10000) }));
  const ht = montants.reduce((a, b) => a + b, 0);
  const tva = ventilation.reduce((a, v) => a + v.montant, 0);
  return { montants, ventilation, ht, tva, ttc: ht + tva };
}

/** TVA contenue dans un TTC (centimes) pour un taux en centièmes (2000 = 20 %). */
function tvaDepuisTtc(ttc, tauxCent) { if (tauxCent <= 0) return 0; return ttc - divArrondi(ttc * 10000, 10000 + tauxCent); }

/** Clé du n° de TVA intracommunautaire français : FR + clé + SIREN. */
function tvaIntraDepuisSiren(siren) {
  const s = String(siren || "").replace(/\D/g, ""); if (s.length !== 9) return "";
  const cle = (12 + 3 * (Number(s) % 97)) % 97; return "FR" + String(cle).padStart(2, "0") + s;
}

/* ---------------------------------------------------------------- Numérotation
   Sans reprise : PREFIXE-AAAA-NNNN. Avec reprise (dernier n° de l'ancien outil) : même format, suite sans trou ;
   si le radical contient une année antérieure, la série repart à 1 avec la nouvelle année. */
function serieNumero(prefixe, reprise, annee) {
  const r = String(reprise || "").trim(), m = /^(.*?)(\d+)$/.exec(r);
  if (!r || !m) return { radical: (prefixe || "F") + "-" + annee + "-", depart: 0, largeur: 4 };
  let radical = m[1], depart = Number(m[2]); const largeur = m[2].length;
  const ans = [...radical.matchAll(/(19|20)\d{2}/g)], an = ans[ans.length - 1];
  if (an && Number(an[0]) < annee) { radical = radical.slice(0, an.index) + annee + radical.slice(an.index + 4); depart = 0; }
  return { radical, depart, largeur };
}
function prochainNumero(prefixe, reprise, annee, existants) {
  const { radical, depart, largeur } = serieNumero(prefixe, reprise, annee);
  const max = existants.filter(n => n && n.startsWith(radical)).map(n => Number(n.slice(radical.length))).filter(Number.isFinite).reduce((a, b) => Math.max(a, b), 0);
  return radical + String(Math.max(depart, max) + 1).padStart(largeur, "0");
}
const repriseValide = r => !String(r || "").trim() || /\d+$/.test(String(r).trim());

/* ---------------------------------------------------------------- XML CrossIndustryInvoice (Factur-X EN 16931) */
function echapXml(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&apos;")
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");
}
const dec2 = c => (c < 0 ? "-" : "") + Math.floor(Math.abs(c) / 100) + "." + String(Math.abs(c) % 100).padStart(2, "0");
const d102 = iso => iso.replace(/-/g, "");

/**
 * doc = { numero, typeCode, dateEmission, dateEcheance (ISO), vendeur, acheteur (parties), lignes [{libelle, qteCent, unite, prixCents, tvaCent}],
 *         franchise, tvaDebits, iban, bic, conditions, notePenalites, noteIndemnite, noteEscompte, mentions, periodeDebut, periodeFin }
 * partie = { nom, siren, siret, tvaIntra, adresse, codePostal, ville, pays, email }
 */
function genererCii(doc) {
  const t = calculerTotaux(doc.lignes, doc.franchise);
  const el = (n, v) => (v === null || v === undefined || String(v).trim() === "") ? "" : `<${n}>${echapXml(String(v).trim())}</${n}>`;
  const date = iso => `<udt:DateTimeString format="102">${d102(iso)}</udt:DateTimeString>`;
  const note = (txt, code) => txt && String(txt).trim() ? `<ram:IncludedNote>${el("ram:Content", txt)}${el("ram:SubjectCode", code)}</ram:IncludedNote>` : "";
  const cat = taux => doc.franchise ? "E" : taux === 0 ? "Z" : "S";
  const partie = (p, vendeur) => {
    const siren = String(p.siren || "").replace(/\D/g, ""), tva = String(p.tvaIntra || "").replace(/\s/g, "").toUpperCase();
    return el("ram:Name", p.nom) +
      (siren ? `<ram:SpecifiedLegalOrganization><ram:ID schemeID="0002">${siren}</ram:ID></ram:SpecifiedLegalOrganization>` : "") +
      `<ram:PostalTradeAddress>${el("ram:PostcodeCode", p.codePostal)}${el("ram:LineOne", p.adresse)}${el("ram:CityName", p.ville)}${el("ram:CountryID", (p.pays || "FR").toUpperCase())}</ram:PostalTradeAddress>` +
      (p.email ? `<ram:URIUniversalCommunication><ram:URIID schemeID="EM">${echapXml(p.email)}</ram:URIID></ram:URIUniversalCommunication>` : "") +
      (tva ? `<ram:SpecifiedTaxRegistration><ram:ID schemeID="VA">${echapXml(tva)}</ram:ID></ram:SpecifiedTaxRegistration>`
        : vendeur && doc.franchise && siren ? `<ram:SpecifiedTaxRegistration><ram:ID schemeID="FC">${siren}</ram:ID></ram:SpecifiedTaxRegistration>` : "");
  };
  let x = `<?xml version="1.0" encoding="UTF-8"?>\n<rsm:CrossIndustryInvoice xmlns:rsm="urn:un:unece:uncefact:data:standard:CrossIndustryInvoice:100" xmlns:qdt="urn:un:unece:uncefact:data:standard:QualifiedDataType:100" xmlns:ram="urn:un:unece:uncefact:data:standard:ReusableAggregateBusinessInformationEntity:100" xmlns:udt="urn:un:unece:uncefact:data:standard:UnqualifiedDataType:100">`;
  x += `<rsm:ExchangedDocumentContext><ram:GuidelineSpecifiedDocumentContextParameter><ram:ID>urn:cen.eu:en16931:2017</ram:ID></ram:GuidelineSpecifiedDocumentContextParameter></rsm:ExchangedDocumentContext>`;
  x += `<rsm:ExchangedDocument>${el("ram:ID", doc.numero)}${el("ram:TypeCode", doc.typeCode || "380")}<ram:IssueDateTime>${date(doc.dateEmission)}</ram:IssueDateTime>`;
  if (doc.franchise) x += note(MENTION_FRANCHISE, "REG");
  x += note(doc.mentions, "REG");
  x += note("Opération : prestations de services" + (doc.tvaDebits ? " - option pour le paiement de la TVA d'après les débits" : ""), "AAI");
  x += note(doc.notePenalites, "PMD") + note(doc.noteIndemnite, "PMT") + note(doc.noteEscompte, "AAB");
  x += `</rsm:ExchangedDocument><rsm:SupplyChainTradeTransaction>`;
  doc.lignes.forEach((l, i) => {
    const taux = doc.franchise ? 0 : l.tvaCent;
    x += `<ram:IncludedSupplyChainTradeLineItem><ram:AssociatedDocumentLineDocument>${el("ram:LineID", i + 1)}</ram:AssociatedDocumentLineDocument>` +
      `<ram:SpecifiedTradeProduct>${el("ram:Name", l.libelle || "Prestation")}</ram:SpecifiedTradeProduct>` +
      `<ram:SpecifiedLineTradeAgreement><ram:NetPriceProductTradePrice>${el("ram:ChargeAmount", dec2(l.prixCents))}</ram:NetPriceProductTradePrice></ram:SpecifiedLineTradeAgreement>` +
      `<ram:SpecifiedLineTradeDelivery><ram:BilledQuantity unitCode="${echapXml(l.unite)}">${dec2(l.qteCent)}</ram:BilledQuantity></ram:SpecifiedLineTradeDelivery>` +
      `<ram:SpecifiedLineTradeSettlement><ram:ApplicableTradeTax>${el("ram:TypeCode", "VAT")}${el("ram:CategoryCode", cat(taux))}${el("ram:RateApplicablePercent", dec2(taux))}</ram:ApplicableTradeTax>` +
      `<ram:SpecifiedTradeSettlementLineMonetarySummation>${el("ram:LineTotalAmount", dec2(t.montants[i]))}</ram:SpecifiedTradeSettlementLineMonetarySummation></ram:SpecifiedLineTradeSettlement></ram:IncludedSupplyChainTradeLineItem>`;
  });
  x += `<ram:ApplicableHeaderTradeAgreement><ram:SellerTradeParty>${partie(doc.vendeur, true)}</ram:SellerTradeParty><ram:BuyerTradeParty>${partie(doc.acheteur, false)}</ram:BuyerTradeParty></ram:ApplicableHeaderTradeAgreement>`;
  x += `<ram:ApplicableHeaderTradeDelivery/><ram:ApplicableHeaderTradeSettlement>${el("ram:PaymentReference", doc.numero)}${el("ram:InvoiceCurrencyCode", "EUR")}<ram:SpecifiedTradeSettlementPaymentMeans>`;
  const iban = String(doc.iban || "").replace(/\s/g, "").toUpperCase(), bic = String(doc.bic || "").replace(/\s/g, "").toUpperCase();
  x += iban ? el("ram:TypeCode", "58") + `<ram:PayeePartyCreditorFinancialAccount>${el("ram:IBANID", iban)}</ram:PayeePartyCreditorFinancialAccount>` +
    (bic ? `<ram:PayeeSpecifiedCreditorFinancialInstitution>${el("ram:BICID", bic)}</ram:PayeeSpecifiedCreditorFinancialInstitution>` : "") : el("ram:TypeCode", "1");
  x += `</ram:SpecifiedTradeSettlementPaymentMeans>`;
  t.ventilation.forEach(v => {
    x += `<ram:ApplicableTradeTax>${el("ram:CalculatedAmount", dec2(v.montant))}${el("ram:TypeCode", "VAT")}${doc.franchise ? el("ram:ExemptionReason", MENTION_FRANCHISE) : ""}` +
      `${el("ram:BasisAmount", dec2(v.base))}${el("ram:CategoryCode", cat(v.taux))}${doc.franchise ? el("ram:ExemptionReasonCode", "VATEX-FR-FRANCHISE") : ""}` +
      `${doc.franchise ? "" : el("ram:DueDateTypeCode", doc.tvaDebits ? "5" : "72")}${el("ram:RateApplicablePercent", dec2(v.taux))}</ram:ApplicableTradeTax>`;
  });
  if (doc.periodeDebut && doc.periodeFin) x += `<ram:BillingSpecifiedPeriod><ram:StartDateTime>${date(doc.periodeDebut)}</ram:StartDateTime><ram:EndDateTime>${date(doc.periodeFin)}</ram:EndDateTime></ram:BillingSpecifiedPeriod>`;
  x += `<ram:SpecifiedTradePaymentTerms>${el("ram:Description", doc.conditions)}<ram:DueDateDateTime>${date(doc.dateEcheance)}</ram:DueDateDateTime></ram:SpecifiedTradePaymentTerms>`;
  x += `<ram:SpecifiedTradeSettlementHeaderMonetarySummation>${el("ram:LineTotalAmount", dec2(t.ht))}${el("ram:TaxBasisTotalAmount", dec2(t.ht))}<ram:TaxTotalAmount currencyID="EUR">${dec2(t.tva)}</ram:TaxTotalAmount>${el("ram:GrandTotalAmount", dec2(t.ttc))}${el("ram:DuePayableAmount", dec2(t.ttc))}</ram:SpecifiedTradeSettlementHeaderMonetarySummation>`;
  x += `</ram:ApplicableHeaderTradeSettlement></rsm:SupplyChainTradeTransaction></rsm:CrossIndustryInvoice>`;
  return x;
}

/* ---------------------------------------------------------------- Lecture d'un justificatif (texte OCR) */
const AnalyseJustificatif = (() => {
  const TAUX = [2000, 1000, 550, 210];
  const MOIS = { JANV: 1, JAN: 1, FEVR: 2, FEV: 2, MARS: 3, MAR: 3, AVR: 4, MAI: 5, JUIN: 6, JUIL: 7, AOUT: 8, SEPT: 9, SEP: 9, OCT: 10, NOV: 11, DEC: 12 };
  const DEPLACEMENT = ["SNCF", "TGV", "OUIGO", "TER ", "TRAIN", "PEAGE", "AUTOROUTE", "VINCI", "SANEF", "APRR", "ASF ", "COFIROUTE", "HOTEL", "IBIS", "CAMPANILE", "KYRIAD", "B&B", "TAXI", "UBER", "BOLT", "PARKING", "PARCMETRE", "INDIGO", "CARBURANT", "GAZOLE", "GASOIL", "SP95", "SP98", "ESSENCE", "STATION", "AIR FRANCE", "EASYJET", "RESTAURANT"];
  const EXCLUS = ["FACTURE", "TICKET", "DATE", "TEL", "SIRET", "SIREN", "TVA", "RUE ", "AVENUE", "BD ", "WWW", "HTTP", "@", "CAISSE", "BIENVENUE", "MERCI", "CLIENT", "N°", "NUMERO", "COMMANDE", "PAGE", "TOTAL", "RCS", "CEDEX"];
  const norm = s => s.normalize("NFD").replace(/\p{M}/gu, "").toUpperCase();
  const mots = s => s.split(/[^A-Z]+/);
  const MONTANT = /(?<![\d,.])(\d{1,3}(?:[ \u00A0.]\d{3})+|\d+)[,.](\d{2})(?![\d%])/g;
  const montants = l => [...l.matchAll(MONTANT)].map(m => Number(m[1].replace(/[ \u00A0.]/g, "")) * 100 + Number(m[2]));
  function trouverDate(lignes, auj) {
    const cands = [];
    lignes.forEach(l => {
      const cle = ["DATE", "LE ", "EMIS", "FACTURE DU"].some(k => l.includes(k));
      for (const m of l.matchAll(/(?<!\d)(\d{1,2})[/.\-](\d{1,2})[/.\-](\d{4}|\d{2})(?!\d)/g)) { let a = +m[3]; if (a < 100) a += 2000; cands.push([new Date(a, m[2] - 1, +m[1]), cle, +m[2], +m[1]]); }
      for (const m of l.matchAll(/(?<!\d)(\d{4})-(\d{2})-(\d{2})(?!\d)/g)) cands.push([new Date(+m[1], m[2] - 1, +m[3]), cle, +m[2], +m[3]]);
      for (const m of l.matchAll(/(?<!\d)(\d{1,2})\s*(JANV|JAN|FEVR|FEV|MARS|MAR|AVR|MAI|JUIN|JUIL|AOUT|SEPT|SEP|OCT|NOV|DEC)[A-Z]*\.?\s*(\d{4})/g)) cands.push([new Date(+m[3], MOIS[m[2]] - 1, +m[1]), cle, MOIS[m[2]], +m[1]]);
    });
    const max = new Date(auj.getFullYear(), auj.getMonth(), auj.getDate() + 1), min = new Date(auj.getFullYear() - 3, auj.getMonth(), auj.getDate());
    const ok = cands.filter(([d, , mo, j]) => d.getMonth() + 1 === mo && d.getDate() === j && d <= max && d > min);
    const r = ok.find(c => c[1]) || ok[0];
    return r ? r[0] : null;
  }
  function joli(s) {
    const t = s.trim().replace(/^[*\-=_. ]+|[*\-=_. ]+$/g, "");
    if (/[a-zà-ÿ]/.test(t)) return t;
    const SIGLES = ["SAS", "SARL", "SA", "EURL", "SNC", "SNCF", "EDF", "OVH", "SFR", "RATP", "BNP", "IKEA"];
    return t.toLowerCase().split(" ").map(m => SIGLES.includes(m.toUpperCase()) || (m.length >= 2 && m.length <= 5 && /^[a-z]+$/.test(m) && !/[aeiouy]/.test(m)) ? m.toUpperCase() : m.charAt(0).toUpperCase() + m.slice(1)).join(" ");
  }
  function analyser(texte, connus = [], auj = new Date()) {
    const lignes = texte.split(/\r?\n/).map(s => s.trim()).filter(Boolean), n = lignes.map(norm), tout = n.join("\n");
    let ttc = null;
    const CLES = ["NET A PAYER", "TOTAL TTC", "MONTANT TTC", "TOTAL A PAYER", "A PAYER", "TOTAL EUR", "TTC", "MONTANT DU", "TOTAL", "CB ", "CARTE BANCAIRE", "PAIEMENT", "MONTANT"];
    boucle: for (const cle of CLES) for (let i = 0; i < n.length; i++) {
      if (n[i].includes(cle) && !mots(n[i]).includes("HT") && !n[i].includes("TVA") && !n[i].includes("%")) {
        let m = montants(n[i]); if (!m.length && i + 1 < n.length) m = montants(n[i + 1]);
        if (m.length) { ttc = Math.max(...m); break boucle; }
      }
    }
    if (ttc === null) { const tous = n.flatMap(montants); if (tous.length) ttc = Math.max(...tous); }
    let ht = null;
    for (const l of n) { const ms = mots(l); if ((ms.includes("HT") || l.includes("HORS TAXE")) && !ms.includes("TTC")) { const m = montants(l); if (m.length) { ht = Math.max(...m); break; } } }
    if (ht !== null && ttc !== null && ht >= ttc) ht = null;
    let taux = null;
    for (const m of tout.matchAll(/(\d{1,2}(?:[,.]\d{1,2})?)\s?%/g)) { const v = Math.round(parseFloat(m[1].replace(",", ".")) * 100); if (TAUX.includes(v)) { taux = v; break; } }
    if (taux === null && ht && ttc) { const r = Math.trunc((ttc - ht) * 10000 / ht); const best = TAUX.reduce((a, b) => Math.abs(b - r) < Math.abs(a - r) ? b : a); if (Math.abs(best - r) <= 60) taux = best; }
    const tva = ttc !== null && ht !== null ? ttc - ht : ttc !== null && taux !== null ? tvaDepuisTtc(ttc, taux) : null;
    const connu = connus.filter(c => c.length >= 3).sort((a, b) => b.length - a.length).find(c => tout.includes(norm(c)));
    let fournisseur = connu || null;
    if (!fournisseur) for (let i = 0; i < Math.min(6, lignes.length); i++) {
      const l = n[i];
      const lettres = (l.match(/[A-Z]/g) || []).length, chiffres = (l.match(/\d/g) || []).length;
      const exclu = EXCLUS.some(k => /^[A-Z]+$/.test(k) ? mots(l).includes(k) : l.includes(k));
      if (lettres >= 3 && chiffres <= l.length / 3 && !exclu) { fournisseur = joli(lignes[i]); break; }
    }
    return { fournisseur, date: trouverDate(n, auj), ttc, ht, tva, taux, deplacement: DEPLACEMENT.some(k => tout.includes(k)) };
  }
  return { analyser };
})();

if (typeof module !== "undefined") module.exports = { divArrondi, montantLigne, calculerTotaux, tvaDepuisTtc, tvaIntraDepuisSiren, prochainNumero, serieNumero, repriseValide, genererCii, AnalyseJustificatif, NOM_APPLI, MENTION_FRANCHISE };

/* =====================================================================
   Chronéo – facture PDF/A-3b avec XML Factur-X embarqué (pdf-lib + fontkit)
   Même mise en page que l'appli Android : logo, filet orange, tableau graphite, annexe des temps.

function b64VersOctets(b64) {
  if (typeof atob === "function") { const s = atob(b64), o = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) o[i] = s.charCodeAt(i); return o; }
  return Uint8Array.from(Buffer.from(b64, "base64"));
}

/**

  const largeur = (s, f, taille) => f.widthOfTextAtSize(nettoyer(s, f), taille);

  const couper = (s, f, taille, max) => {

let audio = null;
function note(f, debut, dureeS, vol = .3, dec = 7, partiels = [[1, 1], [2, .35], [3, .12]]) {
  const t0 = audio.currentTime + debut;
  partiels.forEach(([k, a]) => {
    const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = f * k;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol * a, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + Math.min(dureeS, 5 / dec + .1));
    o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + dureeS);
  });
}
function son(type) {
  if (!D.reglages.sons) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume();
    const cloche = [[1, 1], [2.76, .4], [5.4, .18], [.5, .25]];
    if (type === "depart") { note(659.25, 0, .35, .3, 9); note(987.77, .13, .45, .3, 7); }
    else if (type === "arret") { note(987.77, 0, .3, .3, 9); note(830.61, .12, .3, .3, 9); note(659.25, .24, .6, .3, 5); }
    else { note(1046.5, 0, 1.2, .3, 3.5, cloche); note(784, .45, 1.4, .3, 3, cloche); }
  } catch (e) { /* son indisponible */ }
}

const ONGLETS = ["temps", "clients", "factures", "achats", "bilan"];

// ------------------------------------------------------------ Enregistrer / partager un fichier
async function enregistrerFichier(nom, donnees, type) {
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({ filename: nom, data: donnees instanceof Blob ? donnees : new Blob([donnees], { type }) }); toast("Fichier enregistré"); return; }
  } catch (e) { if (e && e.code === "declined") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(donnees instanceof Blob ? donnees : new Blob([donnees], { type })); a.download = nom;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function partagerFichier(nom, blob, type) {
  const fichier = new File([blob], nom, { type });
  if (navigator.canShare && navigator.canShare({ files: [fichier] })) {
    try { await navigator.share({ files: [fichier], title: nom }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  await enregistrerFichier(nom, blob, type);
}
async function ouvrirFichier(blob) {
  const url = URL.createObjectURL(blob);
  const w = window.open(url, "_blank");
  if (!w) await enregistrerFichier("document", blob, blob.type);
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

// ------------------------------------------------------------ Graphiques SVG (barres, courbes) – toucher un mois le sélectionne
const INITIALES = ["J", "F", "M", "A", "M", "J", "J", "A", "S", "O", "N", "D"];
function maxPropre(v) { if (v <= 0) return 10000; let p = 1; while (p * 10 <= v) p *= 10; return [1, 2, 5, 10].map(k => k * p).find(x => x >= v); }
function axe(c) { const e = Math.floor(c / 100); return e >= 1000 ? (e / 1000).toFixed(e % 1000 >= 100 ? 1 : 0).replace(".", ",") + " k€" : e + " €"; }
function cadreGraphe(maxi, sel, id) {
  const W = 360, Hh = 190, g = 46, b = 20, h = Hh - b - 8, lm = (W - g) / 12;
  let s = `<rect x="${g + sel * lm}" y="0" width="${lm}" height="${Hh - b}" rx="5" fill="var(--pause)" opacity=".55"/>`;
  for (let k = 0; k <= 4; k++) {
    const y = 8 + h * (1 - k / 4);
    s += `<line x1="${g}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--trait)"/><text x="${g - 5}" y="${y + 3.5}" text-anchor="end" font-size="10" fill="var(--texte-2)">${axe(maxi * k / 4)}</text>`;
  }
  INITIALES.forEach((l, m) => s += `<text x="${g + m * lm + lm / 2}" y="${Hh - 5}" text-anchor="middle" font-size="10" font-weight="${m === sel ? 700 : 400}" fill="var(--texte-2)">${l}</text>`);
  for (let m = 0; m < 12; m++) s += `<rect data-mois="${m}" data-graphe="${id}" x="${g + m * lm}" y="0" width="${lm}" height="${Hh}" fill="transparent"/>`;
  return { W, Hh, g, h, lm, s };
}
/** series : [{couleur, valeurs[12]}] ; empile : barres empilées. */
function grapheBarres(id, series, sel, empile) {
  const maxi = maxPropre(empile ? Math.max(...Array.from({ length: 12 }, (_, m) => series.reduce((a, s) => a + (s.valeurs[m] || 0), 0))) : Math.max(0, ...series.flatMap(s => s.valeurs)));
  const c = cadreGraphe(maxi, sel, id); let bars = "";
  const n = empile ? 1 : series.length, lb = c.lm * .66 / n;
  for (let m = 0; m < 12; m++) {
    let cumul = 0;
    series.forEach((s, i) => {
      const v = s.valeurs[m] || 0; if (v <= 0) return;
      const hh = c.h * v / maxi, x = c.g + m * c.lm + c.lm * .17 + (empile ? 0 : i * lb);
      const y = 8 + c.h - (empile ? c.h * cumul / maxi : 0) - hh;
      bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(lb * .92).toFixed(1)}" height="${hh.toFixed(1)}" rx="${empile ? 0 : 3}" fill="${s.couleur}"/>`;
      cumul += v;
    });
  }
  return `<svg class="graphe" viewBox="0 0 ${c.W} ${c.Hh}" role="img">${c.s.replace(/<rect data-mois[\s\S]*$/, "")}${bars}${c.s.match(/<rect data-mois[\s\S]*$/)[0]}</svg>`;
}
/** courbes : [{couleur, valeurs[12] (null = non tracé), pointillee}] */
function grapheCourbes(id, courbes, sel) {
  const maxi = maxPropre(Math.max(0, ...courbes.flatMap(c => c.valeurs.filter(v => v !== null))));
  const c = cadreGraphe(maxi, sel, id); let traces = "";
  courbes.slice().reverse().forEach(cb => {
    const pts = cb.valeurs.map((v, m) => v === null ? null : [c.g + m * c.lm + c.lm / 2, 8 + c.h * (1 - v / maxi)]).filter(Boolean);
    if (!pts.length) return;
    traces += `<polyline points="${pts.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="${cb.couleur}" stroke-width="${cb.pointillee ? 2 : 3}" stroke-linecap="round" stroke-linejoin="round" ${cb.pointillee ? 'stroke-dasharray="6 5" opacity=".7"' : ""}/>`;
    if (!cb.pointillee) pts.forEach(p => traces += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.4" fill="${cb.couleur}" stroke="var(--surface)" stroke-width="1.5"/>`);
  });
  return `<svg class="graphe" viewBox="0 0 ${c.W} ${c.Hh}" role="img">${c.s.replace(/<rect data-mois[\s\S]*$/, "")}${traces}${c.s.match(/<rect data-mois[\s\S]*$/)[0]}</svg>`;
}
const legende = items => `<div class="legende">${items.map(([c, l]) => `<span><i style="background:${c}"></i>${l}</span>`).join("")}</div>`;

/* Chronéo web – chrono, liste des temps, saisie */
// ------------------------------------------------------------ Chrono
function ecouleMs() {
  if (!C.debut) return 0;
  const now = Date.now();
  return now - C.debut - C.pauseCumul - (C.pauseDebut ? now - C.pauseDebut : 0);
}
function demarrer() {
  C.debut = Date.now(); C.pauseDebut = 0; C.pauseCumul = 0; C.dernierCarillon = 0; sauverChrono(); son("depart"); rendre();
}
function basculerPause() {
  const now = Date.now();
  if (C.pauseDebut) { C.pauseCumul += now - C.pauseDebut; C.pauseDebut = 0; } else C.pauseDebut = now;
  sauverChrono(); rendre();
}
function arreter() {
  const now = Date.now();
  if (C.pauseDebut) { C.pauseCumul += now - C.pauseDebut; C.pauseDebut = 0; }
  const d0 = new Date(C.debut), d1 = new Date(now);
  const debut = d0.getHours() * 60 + d0.getMinutes();
  let fin = d1.getHours() * 60 + d1.getMinutes();
  const pause = Math.round(C.pauseCumul / 60000);
  if (fin <= debut) fin = Math.min(1439, debut + Math.max(1, Math.round((now - C.debut) / 60000)));
  const jour = isoJour(d0);
  C.debut = 0; C.pauseCumul = 0; sauverChrono(); son("arret");
  ouvrirSaisie(null, { jour, debut, fin, pause, missionId: C.missionId, intervenantId: C.intervenantId });
}
// Mise à jour chaque seconde + carillon à chaque heure de temps effectif
setInterval(() => {
  if (!C.debut) return;
  const e = ecouleMs(), heures = Math.floor(e / 3600000);
  if (!C.pauseDebut && heures > (C.dernierCarillon || 0)) { C.dernierCarillon = heures; sauverChrono(); son("heure"); }
  const el = $("#ecoule"); if (el) el.textContent = hms(e);
  const a = $("#anneau"); if (a) a.style.strokeDashoffset = String(CIRC * (1 - (e % 3600000) / 3600000));
}, 1000);
const hms = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 3600) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60); };
const CIRC = 2 * Math.PI * 96;

function carteChrono() {
  const actives = D.missions.filter(m => !m.terminee);
  const intervs = D.intervenants.filter(i => i.actif !== false);
  const actif = !!C.debut, enPause = !!C.pauseDebut;
  const e = ecouleMs();
  const offset = actif ? CIRC * (1 - (e % 3600000) / 3600000) : CIRC;
  const m = mission(C.missionId);
  let corps;
  if (actif) {
    const d0 = new Date(C.debut);
    corps = `<div class="sous-cadran">${enPause ? "En pause" : "En cours"} depuis ${texteHeure(d0.getHours() * 60 + d0.getMinutes())}<br>${echap(nomMission(m))}${C.intervenantId && intervenant(C.intervenantId) ? "<br>" + echap(intervenant(C.intervenantId).nom) : ""}</div>
      <div class="boutons"><button class="btn contour" data-a="pause">${enPause ? "Reprendre" : "Pause"}</button><button class="btn sombre" data-a="arret">Arrêter</button></div>`;
  } else if (!actives.length) {
    corps = `<div class="sous-cadran">Créez une mission (onglet Clients) pour utiliser le chrono.</div>`;
  } else {
    corps = `<select data-c="mission" aria-label="Mission"><option value="">Choisir la mission…</option>${actives.map(x => `<option value="${x.id}" ${x.id === C.missionId ? "selected" : ""}>${echap(nomMission(x))}</option>`).join("")}</select>
      ${intervs.length ? `<select data-c="intervenant" aria-label="Intervenant"><option value="">Choisir l’intervenant…</option>${intervs.map(i => `<option value="${i.id}" ${i.id === C.intervenantId ? "selected" : ""}>${echap(i.nom)}</option>`).join("")}</select>` : ""}
      <div class="boutons"><button class="btn" data-a="depart" ${(m && !m.terminee) && (!intervs.length || intervs.some(i => i.id === C.intervenantId)) ? "" : "disabled"}>▶ Démarrer</button></div>`;
  }
  return `<section class="chrono ${actif ? (enPause ? "pause" : "actif") : ""}">
    <div class="cadran"><svg viewBox="0 0 210 210"><circle class="fond-anneau" cx="105" cy="105" r="96" fill="none" stroke-width="10"/>
      <circle id="anneau" class="anneau" cx="105" cy="105" r="96" fill="none" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${CIRC}" style="stroke-dashoffset:${offset}"/></svg>
      <div><div class="temps-ecoule" id="ecoule">${hms(e)}</div>
      <div class="sous-cadran">${actif ? (enPause ? "en pause" : C.pauseCumul >= 60000 ? "pauses déduites" : "1 tour = 1 heure") : "chrono"}</div></div></div>
    ${corps}</section>`;
}

// ------------------------------------------------------------ Périodes
const ETAT = { periode: "mois", decalage: 0, parMission: false, nonFacturees: false };
function plage() {
  const r = new Date(), d = ETAT.decalage;
  let a, b;
  if (ETAT.periode === "annee") { a = new Date(r.getFullYear() + d, 0, 1); b = new Date(r.getFullYear() + d, 11, 31); }
  else if (ETAT.periode === "trimestre") { const q = Math.floor(r.getMonth() / 3); a = new Date(r.getFullYear(), q * 3 + 3 * d, 1); b = new Date(a.getFullYear(), a.getMonth() + 3, 0); }
  else if (ETAT.periode === "mois") { a = new Date(r.getFullYear(), r.getMonth() + d, 1); b = new Date(a.getFullYear(), a.getMonth() + 1, 0); }
  else if (ETAT.periode === "semaine") { const l = (r.getDay() + 6) % 7; a = new Date(r.getFullYear(), r.getMonth(), r.getDate() - l + 7 * d); b = new Date(a.getFullYear(), a.getMonth(), a.getDate() + 6); }
  else return null;
  return [isoJour(a), isoJour(b)];
}
function semaineIso(dt) { const d = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate())); const j = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() + 4 - j); const a = new Date(Date.UTC(d.getUTCFullYear(), 0, 1)); return Math.ceil(((d - a) / 86400000 + 1) / 7); }
function titrePeriode(p) {
  const a = dateDe(p[0]), b = dateDe(p[1]);
  if (ETAT.periode === "annee") return String(a.getFullYear());
  if (ETAT.periode === "trimestre") return "T" + (Math.floor(a.getMonth() / 3) + 1) + " " + a.getFullYear();
  if (ETAT.periode === "mois") { const t = MOIS[a.getMonth()] + " " + a.getFullYear(); return t[0].toUpperCase() + t.slice(1); }
  return "Semaine " + semaineIso(a) + ", du " + pad(a.getDate()) + "/" + pad(a.getMonth() + 1) + " au " + pad(b.getDate()) + "/" + pad(b.getMonth() + 1);
}

function rendreTemps() {
  barre("Temps", { principal: true });
  const p = plage();
  let liste = D.saisies.slice().sort((a, b) => b.jour.localeCompare(a.jour) || (b.debut || 0) - (a.debut || 0));
  if (p) liste = liste.filter(s => s.jour >= p[0] && s.jour <= p[1]);

  const aFacturer = liste.filter(s => statutDe(s) === "afacturer").reduce((t, s) => t + valeur(s), 0);
  const visibles = ETAT.nonFacturees ? liste.filter(s => statutDe(s) === "afacturer") : liste;

  let groupes;

    <div class="resume"><div><div class="petit">${p ? "Sur la période" : "Total"}</div><div class="grand">${duree(total)}</div><div class="petit">${jours(total)}, ${liste.length} saisie${liste.length > 1 ? "s" : ""}</div></div>

      : `<p class="vide">${D.saisies.length ? "Aucune saisie sur cette période." : "Aucune saisie pour l’instant. Démarrez le chrono ou touchez + pour ajouter un temps."}</p>`}

// ------------------------------------------------------------ Glisser une ligne (action réglable, une seule fois)
const ACTIONS = { aujourdhui: "Dupliquer à aujourd’hui", memejour: "Dupliquer (même date)", modifier: "Dupliquer et modifier", supprimer: "Supprimer", aucune: "Aucune action" };
function activerGlisser(el) {
  const ligne = el.querySelector(".ligne"), fond = el.querySelector(".fond-action");
  const s = D.saisies.find(x => x.id === el.dataset.id);
  let x0 = 0, y0 = 0, dx = 0, actif = false, bouge = false;
  ligne.addEventListener("pointerdown", e => { x0 = e.clientX; y0 = e.clientY; dx = 0; actif = true; bouge = false; });
  ligne.addEventListener("pointermove", e => {
    if (!actif) return;
    const ddx = e.clientX - x0, ddy = e.clientY - y0;
    if (!bouge && Math.abs(ddx) > 10 && Math.abs(ddx) > Math.abs(ddy)) { bouge = true; el.classList.add("en-cours"); ligne.setPointerCapture(e.pointerId); }
    if (!bouge) return;
    const action = ddx > 0 ? D.reglages.glisserDroite : D.reglages.glisserGauche;
    dx = action === "aucune" ? 0 : ddx;
    ligne.style.transform = `translateX(${dx}px)`;
    const seuil = el.offsetWidth * .35;
    fond.textContent = ACTIONS[action]; fond.className = "fond-action" + (ddx < 0 ? " gauche" : "") + (action === "supprimer" ? " danger" : "");
    fond.style.opacity = dx === 0 ? 0 : Math.abs(dx) >= seuil ? 1 : .5;
  });
  const fin = () => {
    if (!actif) return; actif = false;
    el.classList.remove("en-cours"); ligne.style.transform = ""; fond.style.opacity = 0;
    if (!bouge) return;
    const seuil = el.offsetWidth * .35;
    if (Math.abs(dx) >= seuil) agir(dx > 0 ? D.reglages.glisserDroite : D.reglages.glisserGauche, s);
  };
  ligne.addEventListener("pointerup", fin); ligne.addEventListener("pointercancel", fin);
  ligne.addEventListener("click", e => { if (bouge) { e.preventDefault(); return; } if (s.statut === "facture") { toast("Temps facturé : non modifiable"); return; } ouvrirSaisie(s); });
}
function agir(action, s) {
  if (action === "aucune") return;
  if (action === "supprimer") {
    if (s.statut === "facture") { toast("Temps facturé : suppression impossible"); return; }
    const i = D.saisies.indexOf(s); D.saisies.splice(i, 1); sauver(); rendre();
    toast("Temps supprimé", "Annuler", () => { D.saisies.splice(i, 0, s); sauver(); rendre(); });
    return;
  }
  const jour = action === "memejour" ? s.jour : isoJour();
  const copie = Object.assign({}, s, { id: uid(), jour, statut: s.statut === "nonfact" ? "nonfact" : "afacturer" });
  D.saisies.push(copie); sauver();
  if (action === "modifier") { ouvrirSaisie(copie); return; }
  rendre();
  toast("Temps dupliqué au " + jourCourt(jour), "Annuler", () => { D.saisies = D.saisies.filter(x => x.id !== copie.id); sauver(); rendre(); });
}

// ------------------------------------------------------------ Formulaire de saisie (plein écran)
const DEMI_HEURES = Array.from({ length: 48 }, (_, i) => texteHeure(i * 30));
function champHeure(nom, valeur, libelle, liste) {
  return `<label class="champ"><span>${libelle}</span><input name="${nom}" value="${valeur}" inputmode="numeric" autocomplete="off" list="${liste}" placeholder="09:30"></label>`;
}
function formaterHeure(input) {
  input.addEventListener("input", () => {
    const c = input.value.replace(/\D/g, ""), max = c[0] > "2" ? 3 : 4, v = c.slice(0, max);
    input.value = v.length === 3 && v[0] > "2" ? v[0] + ":" + v.slice(1) : v.length > 2 ? v.slice(0, 2) + ":" + v.slice(2) : v;
  });
}
function ouvrirSaisie(s, pre = {}) { ouvrir(() => ecranSaisie(s, pre)); }
function ecranSaisie(s, pre = {}) {

  const derniere = D.saisies.slice().sort((a, b) => b.jour.localeCompare(a.jour))[0];

    missionId: pre.missionId || (derniere && mission(derniere.missionId) && !mission(derniere.missionId).terminee ? derniere.missionId : D.missions.find(m => !m.terminee)?.id),
    intervenantId: pre.intervenantId || C.intervenantId || null, description: "", statut: "afacturer",
  };
  const missions = D.missions.filter(m => !m.terminee || m.id === v.missionId);
  const intervs = D.intervenants.filter(i => i.actif !== false || i.id === v.intervenantId);
  const verrou = s && s.statut === "facture";
  const fermer = () => retour();

    const obj = Object.assign(s || { id: uid() }, {
      jour: f.jour.value, debut: d, fin: fi, pause: pa, minutes: fi - d - pa, missionId: m.id, clientId: m.clientId,
      intervenantId: f.intervenant ? (f.intervenant.value || null) : null, description: f.description.value.trim(),
      statut: f.statut.value,
    });
    if (nouveau) D.saisies.push(obj);
    if (obj.intervenantId) C.intervenantId = obj.intervenantId, sauverChrono();
    sauver(); toast(nouveau ? "Temps enregistré" : "Temps modifié"); fermer();
  };
  barre(nouveau ? "Nouvelle saisie" : "Modifier la saisie", { action: { libelle: "Enregistrer", faire: enregistrer, inactif: verrou } });
  $("#vue").innerHTML = `<form id="form" autocomplete="off" onsubmit="return false">
    ${verrou ? `<p class="note ko">Ce temps figure sur une facture : il n’est plus modifiable.</p>` : ""}

    ${intervs.length ? `<label class="champ"><span>Intervenant</span><select name="intervenant"><option value="">—</option>${intervs.map(i => `<option value="${i.id}" ${i.id === v.intervenantId ? "selected" : ""}>${echap(i.nom)}</option>`).join("")}</select></label>` : ""}
    <div class="section">Horaires</div>
    <label class="champ"><span>Date</span><input type="date" name="jour" value="${v.jour}"></label>
    <div class="deux">${champHeure("debut", v.debut != null ? texteHeure(v.debut) : "", "Début", "demi-heures")}${champHeure("fin", v.fin != null ? texteHeure(v.fin) : "", "Fin", "demi-heures")}</div>
    ${champHeure("pause", texteHeure(v.pause || 0), "Pause non facturée (h:mm)", "pauses")}
    <p class="note" id="calcul"></p>
    <label class="champ"><span>Description du travail réalisé</span><textarea name="description">${echap(v.description)}</textarea></label>
    <div class="section">Facturation</div>
    <label class="champ"><span>Statut</span><select name="statut" ${verrou ? "disabled" : ""}>
      ${(verrou ? [["facture", "Facturée"]] : [["afacturer", "À facturer"], ["ancien", "Déjà facturé (ancien outil)"], ["nonfact", "Non facturable"]])
        .map(([c, l]) => `<option value="${c}" ${(v.statut || "afacturer") === c ? "selected" : ""}>${l}</option>`).join("")}</select></label>
    <p class="note" id="valeur"></p>
    <button class="btn large" type="button" id="enreg" ${verrou ? "disabled" : ""}>Enregistrer</button>
    ${!nouveau && !verrou ? `<button class="btn danger large" type="button" id="suppr" style="margin-top:10px">Supprimer ce temps</button>` : ""}
    <datalist id="demi-heures">${DEMI_HEURES.map(h => `<option value="${h}">`).join("")}</datalist>
    <datalist id="pauses">${[0, 15, 30, 45, 60, 75, 90, 120].map(m => `<option value="${texteHeure(m)}">`).join("")}</datalist>

    $("#enreg").disabled = verrou || !ok || !m; const a = $("#barre .action"); if (a) a.disabled = verrou || !ok || !m;
  };
  f.addEventListener("input", maj); f.addEventListener("change", maj); maj();
  $("#enreg").onclick = enregistrer;

// ------------------------------------------------------------ Recherche Sirene (API publique « Recherche d'entreprises »)
const TYPES_VOIE = { AV: "avenue", BD: "boulevard", CHE: "chemin", CRS: "cours", ALL: "allée", IMP: "impasse", PL: "place", QUA: "quai", RTE: "route", SQ: "square", PRO: "promenade", FG: "faubourg", PAS: "passage", RLE: "ruelle", HAM: "hameau", LD: "lieu-dit" };
function joliNom(s) {
  if (!s || /[a-zà-ÿ]/.test(s)) return s || "";
  const SIGLES = ["SAS", "SASU", "SARL", "EURL", "SA", "SCI", "SNC", "SCP", "SCOP", "SELARL", "SELAS", "GIE", "EIRL", "EI", "ZA", "ZI", "ZAC", "BP", "CS", "CEDEX"];
  const petits = ["de", "du", "des", "la", "le", "les", "et", "en", "sur", "sous", "aux", "au", "d", "l"];
  return s.toLowerCase().split(" ").map((m, i) => SIGLES.includes(m.replace(/[,.]/g, "").toUpperCase()) ? m.toUpperCase()
    : i > 0 && petits.includes(m) ? m
    : m.split("-").map(p => p.split("'").map((x, k) => k === 0 && i > 0 && ["d", "l"].includes(x) && p.includes("'") ? x : x.charAt(0).toUpperCase() + x.slice(1)).join("'")).join("-")).join(" ");
}
async function rechercheSirene(numero) {
  const n = String(numero).replace(/\D/g, "");
  if (n.length !== 9 && n.length !== 14) throw new Error("Saisissez un SIREN (9 chiffres) ou un SIRET (14 chiffres)");
  const rep = await fetch(`https://recherche-entreprises.api.gouv.fr/search?q=${n.slice(0, 9)}&page=1&per_page=1`, { headers: { Accept: "application/json" } });
  if (rep.status === 429) throw new Error("Trop de requêtes, réessayez dans une minute");
  if (!rep.ok) throw new Error("Service indisponible (HTTP " + rep.status + ")");
  const r = (await rep.json()).results?.[0]; if (!r) throw new Error("Aucune entreprise trouvée");
  const siege = r.siege || {};
  const etab = n.length === 14 ? (r.matching_etablissements || []).find(e => e.siret === n) || siege : siege;
  const v = k => (etab[k] ?? "").toString().trim();
  const voie = [v("numero_voie") + (v("indice_repetition") ? " " + v("indice_repetition") : ""), TYPES_VOIE[v("type_voie").toUpperCase()] || v("type_voie").toLowerCase(), joliNom(v("libelle_voie"))].filter(Boolean).join(" ");
  const adresse = [v("complement_adresse"), voie].filter(Boolean).join(", ") || v("adresse").split(v("code_postal"))[0].trim().replace(/,$/, "");
  const siren = r.siren || n.slice(0, 9);
  return { nom: joliNom(r.nom_raison_sociale || r.nom_complet || ""), siren, siret: v("siret"), adresse: joliNom(adresse), codePostal: v("code_postal"), ville: joliNom(v("libelle_commune")),
    tvaIntra: tvaIntraDepuisSiren(siren), active: (r.etat_administratif || "A") === "A" && (etab.etat_administratif || "A") === "A" };
}
/** Branche le bouton de recherche Sirene d'un formulaire sur un champ numéro et une fonction de remplissage. */
function brancherSirene(champ, bouton, info, remplir) {
  const maj = () => { const n = champ.value.replace(/\D/g, ""); bouton.disabled = !(n.length === 9 || n.length === 14); };
  champ.addEventListener("input", maj); maj();
  bouton.onclick = async () => {
    bouton.disabled = true; info.className = "note"; info.innerHTML = `<span class="chargement"></span> Recherche…`;
    try { const r = await rechercheSirene(champ.value); remplir(r); info.className = "note " + (r.active ? "ok" : "ko"); info.textContent = r.active ? "Informations récupérées (base Sirene)" : "Attention : établissement fermé selon Sirene"; }
    catch (e) { info.className = "note ko"; info.textContent = e.message === "Failed to fetch" ? "Recherche impossible (pas de connexion ?)" : e.message; }
    maj();
  };
}

/* Chronéo web – factures (brouillon, émission Factur-X, paiement, déclaration de TVA) */

const UNITES = { HUR: "heure", DAY: "jour", C62: "unité / forfait" };
const totauxFacture = f => calculerTotaux(D.lignes.filter(l => l.factureId === f.id).sort((a, b) => a.ordre - b.ordre), D.emetteur.franchiseTva);
function recalculer(f) { const t = totauxFacture(f); f.ht = t.ht; f.ttc = t.ttc; }
const periodeTexte = isos => { const d = isos.reduce((a, b) => a < b ? a : b), f = isos.reduce((a, b) => a > b ? a : b); return d === f ? "le " + jourCourt(d) : `période du ${jourCourt(d)} au ${jourCourt(f)}`; };

// ------------------------------------------------------------ Liste
function rendreFactures() {
  barre("Factures", { principal: true });
  const auj = isoJour();
  const fs = D.factures.slice().sort((a, b) => (a.statut === "BROUILLON" ? 0 : 1) - (b.statut === "BROUILLON" ? 0 : 1) || (b.jourEmission || "").localeCompare(a.jourEmission || "") || b.id.localeCompare(a.id));
  const attente = fs.filter(f => f.statut === "EMISE").reduce((t, f) => t + f.ttc, 0);
  vue(`<div class="resume"><div><div class="petit">En attente de paiement</div><div class="grand">${euros(attente)}</div></div></div>` +
    (fs.length ? fs.map(f => {
      const c = client(f.clientId), retard = f.statut === "EMISE" && f.jourEcheance < auj;
      const statut = f.statut === "BROUILLON" ? `<span class="statut-p">Brouillon</span>` : f.statut === "PAYEE" ? `<span class="statut-p payee">Payée le ${jourCourt(f.jourPaiement)}</span>`
        : retard ? `<span class="statut-p retard">En retard, échéance ${jourCourt(f.jourEcheance)}</span>` : `<span class="statut-p">Émise le ${jourCourt(f.jourEmission)}</span>`;
      const tva = f.statut !== "BROUILLON" && f.ttc !== f.ht ? `<span class="petit">${f.jourDeclarationTva ? "TVA déclarée" : "TVA non déclarée"}</span>` : "";
      return `<button class="carte cliquable" data-f="${f.id}"><div class="entete"><span>${echap(f.numero || "Brouillon")}</span><span>${euros(f.ttc)}</span></div>
        <div class="petit">${echap(c?.nom || "?")}</div><div class="boutons-ligne" style="margin-top:4px;align-items:center">${statut} ${tva}</div></button>`;
    }).join("") : `<p class="vide">Aucune facture. Saisissez des temps puis créez une facture.</p>`) +
    `<button class="fab" id="ajouter" aria-label="Nouvelle facture">+</button>`);
  $$("[data-f]").forEach(b => b.onclick = () => ouvrir(() => ecranFacture(b.dataset.f)));
  $("#ajouter").onclick = () => { ecranNouvelleFacture.etat = null; ouvrir(ecranNouvelleFacture); };
}

// ------------------------------------------------------------ Nouvelle facture à partir des temps
function ecranNouvelleFacture() {
  const etat = ecranNouvelleFacture.etat || (ecranNouvelleFacture.etat = { clientId: null, coches: null, annexe: true });
  const creer = () => {
    const c = client(etat.clientId); if (!c) return;
    const choisies = D.saisies.filter(s => etat.coches.has(s.id));
    const e = D.emetteur, tva = e.franchiseTva ? 0 : e.tauxTvaCentiemes;
    const f = { id: uid(), clientId: c.id, numero: null, statut: "BROUILLON", jourCreation: isoJour(), avecAnnexe: etat.annexe, ht: 0, ttc: 0 };
    D.factures.push(f);
    const groupes = new Map(); choisies.forEach(s => { const k = s.missionId || "-"; if (!groupes.has(k)) groupes.set(k, []); groupes.get(k).push(s); });
    let ordre = 0;
    groupes.forEach((liste, k) => {
      const m = mission(k), minutes = liste.reduce((t, s) => t + s.minutes, 0);
      D.lignes.push({ id: uid(), factureId: f.id, ordre: ordre++, libelle: `${m ? m.nom : "Prestations"} – ${periodeTexte(liste.map(s => s.jour))}`,
        qteCent: Math.round(minutes * 100 / base()), unite: "DAY", prixCents: tjmDe(m, c), tvaCent: tva, missionId: m ? m.id : null });
    });
    choisies.forEach(s => { s.statut = "facture"; s.factureId = f.id; });
    recalculer(f); sauver(); ecranNouvelleFacture.etat = null;
    remplacer(() => ecranFacture(f.id));   // l'écran de création laisse la place à la facture
  };
  barre("Nouvelle facture", { action: { libelle: "Créer", faire: creer, inactif: !etat.clientId } });
  const clients = D.clients.slice().sort((a, b) => a.nom.localeCompare(b.nom, "fr"));
  const dispo = etat.clientId ? D.saisies.filter(s => s.clientId === etat.clientId && statutDe(s) === "afacturer").sort((a, b) => a.jour.localeCompare(b.jour)) : [];
  if (etat.clientId && !etat.coches) etat.coches = new Set(dispo.map(s => s.id));
  const choisies = dispo.filter(s => etat.coches && etat.coches.has(s.id));
  const groupes = new Map(); dispo.forEach(s => { const k = s.missionId || "-"; if (!groupes.has(k)) groupes.set(k, []); groupes.get(k).push(s); });
  const c = client(etat.clientId);
  let totalHt = 0;
  const apercu = [...groupes.entries()].map(([k, l]) => {
    const sel = l.filter(s => etat.coches.has(s.id)); if (!sel.length) return "";
    const m = mission(k), cent = Math.round(sel.reduce((t, s) => t + s.minutes, 0) * 100 / base()), tjm = tjmDe(m, c), mt = Math.round(cent * tjm / 100); totalHt += mt;
    return `<div class="ligne-simple"><div class="g">${echap(m ? m.nom : "Prestations")} – ${periodeTexte(sel.map(s => s.jour))}<div class="petit ${tjm ? "" : "erreur-t"}">${depuisCentiemes(cent)} j × ${euros(tjm)}${tjm ? "" : " (TJM à définir)"}</div></div><div class="fort">${euros(mt)}</div></div>`;
  }).join("");
  vue(`<form id="form" onsubmit="return false">
    <div class="section">Client</div>
    <label class="champ"><span>Client</span><select id="client"><option value="">Choisir…</option>${clients.map(x => `<option value="${x.id}" ${x.id === etat.clientId ? "selected" : ""}>${echap(x.nom)}</option>`).join("")}</select></label>
    ${etat.clientId ? (dispo.length ? `
      <div class="section">Lignes de la facture</div>${apercu || `<p class="note">Aucun temps sélectionné.</p>`}
      ${apercu ? `<p class="fort" style="text-align:right">Total HT : ${euros(totalHt)}</p>` : ""}
      <label class="case"><input type="checkbox" id="annexe" ${etat.annexe ? "checked" : ""}> Joindre le détail des temps en annexe du PDF</label>
      <div class="section">Temps sélectionnés : ${duree(choisies.reduce((t, s) => t + s.minutes, 0))} (${jours(choisies.reduce((t, s) => t + s.minutes, 0))})</div>
      ${[...groupes.entries()].map(([k, l]) => `<label class="case fort"><input type="checkbox" data-groupe="${k}" ${l.every(s => etat.coches.has(s.id)) ? "checked" : ""}> ${echap(mission(k)?.nom || "Sans mission")}</label>` +
        l.map(s => `<label class="case" style="padding-left:28px"><input type="checkbox" data-s="${s.id}" ${etat.coches.has(s.id) ? "checked" : ""}><span style="flex:1">${jourCourt(s.jour)}${s.debut != null ? ", " + texteHeure(s.debut) + "–" + texteHeure(s.fin) : ""}, ${duree(s.minutes)}<span class="petit" style="display:block">${echap(s.description)}</span></span></label>`).join("")).join("")}`
      : `<p class="note">Aucun temps à facturer pour ce client. Vous pourrez ajouter des lignes libres.</p>`) : ""}
    <button class="btn large" type="button" id="creer" ${etat.clientId ? "" : "disabled"} style="margin-top:14px">Créer le brouillon</button></form>`);
  $("#client").onchange = e => { etat.clientId = e.target.value || null; etat.coches = null; rendre(); };
  const a = $("#annexe"); if (a) a.onchange = e => etat.annexe = e.target.checked;
  $$("[data-s]").forEach(i => i.onchange = () => { i.checked ? etat.coches.add(i.dataset.s) : etat.coches.delete(i.dataset.s); rendre(); });
  $$("[data-groupe]").forEach(i => i.onchange = () => { groupes.get(i.dataset.groupe).forEach(s => i.checked ? etat.coches.add(s.id) : etat.coches.delete(s.id)); rendre(); });
  $("#creer").onclick = creer;
}

// ------------------------------------------------------------ Contrôles avant émission
function controler(f) {
  const e = D.emetteur, c = client(f.clientId), lignes = D.lignes.filter(l => l.factureId === f.id), p = [];
  if (!e.raisonSociale) p.push("Réglages : raison sociale manquante");
  if (String(e.siren).replace(/\D/g, "").length !== 9) p.push("Réglages : SIREN (9 chiffres) manquant");
  if (!e.adresse || !e.codePostal || !e.ville) p.push("Réglages : adresse incomplète");
  if (!e.franchiseTva && !e.tvaIntra) p.push("Réglages : n° de TVA intracommunautaire requis (ou cochez la franchise en base)");
  if (!e.iban) p.push("Réglages : IBAN manquant");
  if (!c) p.push("Client introuvable");
  else { if (!c.adresse || !c.ville) p.push("Client : adresse incomplète"); if ((c.pays || "FR") === "FR" && String(c.siren || "").replace(/\D/g, "").length !== 9) p.push("Client : SIREN requis"); }
  if (!lignes.length) p.push("La facture ne contient aucune ligne");
  if (lignes.some(l => l.prixCents <= 0 || l.qteCent <= 0)) p.push("Une ligne a une quantité ou un prix nul");
  return p;
}
async function logoFacture() {
  const mode = D.reglages.logo;
  if (mode === "aucun") return null;
  if (mode === "perso") { const b = await Fichiers.lire("logo"); if (b) return new Uint8Array(await b.arrayBuffer()); }
  return b64VersOctets(LOGO_DEFAUT_JPEG);
}
async function emettre(f) {
  const e = D.emetteur, c = client(f.clientId);
  const lignes = D.lignes.filter(l => l.factureId === f.id).sort((a, b) => a.ordre - b.ordre);
  const saisies = D.saisies.filter(s => s.factureId === f.id).sort((a, b) => (mission(a.missionId)?.nom || "").localeCompare(mission(b.missionId)?.nom || "") || a.jour.localeCompare(b.jour) || (a.debut || 0) - (b.debut || 0));
  const auj = isoJour(), numero = prochainNumero(e.prefixe, e.dernierNumeroReprise, new Date().getFullYear(), D.factures.map(x => x.numero).filter(Boolean));
  const echeance = ajouterJours(auj, Number(e.delaiPaiementJours) || 30);
  const doc = {
    numero, dateEmission: auj, dateEcheance: echeance, vendeur: partieEmetteur(e), acheteur: partieClient(c),
    lignes: lignes.map(l => ({ libelle: l.libelle, qteCent: l.qteCent, unite: l.unite, prixCents: l.prixCents, tvaCent: l.tvaCent })),
    franchise: e.franchiseTva, tvaDebits: e.tvaSurDebits, iban: e.iban, bic: e.bic, conditions: `Paiement à ${e.delaiPaiementJours} jours`,
    notePenalites: e.notePenalites, noteIndemnite: e.noteIndemnite, noteEscompte: e.noteEscompte, mentions: e.mentionsLegales,
    periodeDebut: saisies.length ? saisies.map(s => s.jour).reduce((a, b) => a < b ? a : b) : null,
    periodeFin: saisies.length ? saisies.map(s => s.jour).reduce((a, b) => a > b ? a : b) : null,
    minutesParJour: base(),
    annexe: f.avecAnnexe ? saisies.map(s => ({ date: s.jour, debut: s.debut != null ? texteHeure(s.debut) : "", fin: s.fin != null ? texteHeure(s.fin) : "", pause: s.pause || 0,
      minutes: s.minutes, intervenant: intervenant(s.intervenantId)?.nom || "", mission: mission(s.missionId)?.nom || "", description: s.description || "" })) : [],
  };
  const octets = await genererFacturXPdf(doc, await logoFacture());
  await Fichiers.mettre("pdf-" + f.id, new Blob([octets], { type: "application/pdf" }));
  Object.assign(f, { numero, statut: "EMISE", jourEmission: auj, jourEcheance: echeance, pdf: "pdf-" + f.id });
  recalculer(f); sauver();
}

// ------------------------------------------------------------ Détail d'une facture
function ecranFacture(id) {
  const f = facture(id); if (!f) return retour();
  const c = client(f.clientId), brouillon = f.statut === "BROUILLON", e = D.emetteur;
  const lignes = D.lignes.filter(l => l.factureId === f.id).sort((a, b) => a.ordre - b.ordre);
  const t = totauxFacture(f);
  barre(f.numero || "Brouillon");
  const statut = brouillon ? "Brouillon modifiable : le numéro est attribué à l’émission" : f.statut === "PAYEE" ? `Payée le ${jourCourt(f.jourPaiement)}` : `Émise le ${jourCourt(f.jourEmission)}, échéance ${jourCourt(f.jourEcheance)}`;
  vue(`<div class="carte accent" style="margin-top:14px"><div class="fort">${echap(c?.nom || "?")}</div><div class="petit">${statut}</div></div>
    <div class="section">Lignes</div>
    ${lignes.map((l, i) => `<div class="ligne-simple" ${brouillon ? `data-l="${l.id}" style="cursor:pointer"` : ""}><div class="g">${echap(l.libelle)}<div class="petit">${depuisCentiemes(l.qteCent)} ${UNITES[l.unite] || ""} × ${euros(l.prixCents)}${e.franchiseTva ? "" : `, TVA ${depuisCentiemes(l.tvaCent)} %`}</div></div><div>${euros(t.montants[i])}</div></div>`).join("") || `<p class="note">Aucune ligne.</p>`}
    ${brouillon ? `<button class="btn contour" id="ligne-libre" style="margin-top:8px">+ Ligne libre</button>
      <label class="case"><input type="checkbox" id="annexe" ${f.avecAnnexe ? "checked" : ""}> Détail des temps en annexe du PDF</label>` : ""}
    <div class="section">Totaux</div>
    <div class="ligne-simple"><span>Total HT</span><span>${euros(t.ht)}</span></div>
    ${e.franchiseTva ? `<p class="note">${MENTION_FRANCHISE}</p>` : t.ventilation.map(v => `<div class="ligne-simple"><span>TVA ${depuisCentiemes(v.taux)} %</span><span>${euros(v.montant)}</span></div>`).join("")}
    <div class="ligne-simple fort"><span>Total TTC</span><span>${euros(t.ttc)}</span></div>
    ${brouillon ? `<div id="controle"></div>
      <button class="btn large" id="emettre" style="margin-top:14px">Émettre la facture (Factur-X)</button>
      <button class="btn danger large" id="suppr" style="margin-top:10px">Supprimer le brouillon</button>`
    : `<div class="boutons-ligne" style="margin-top:14px"><button class="btn" id="partager">Envoyer / partager le PDF</button><button class="btn contour" id="telecharger">Enregistrer le PDF</button></div>
      <div class="section">Paiement</div>
      ${f.statut === "PAYEE" ? `<p class="note ok">Payée le ${jourCourt(f.jourPaiement)}</p>` : ""}
      <div class="deux" style="align-items:end"><label class="champ"><span>Date de paiement</span><input type="date" id="date-paiement" min="${f.jourEmission}" value="${f.jourPaiement || isoJour()}"></label>
        <button class="btn" id="payer" style="margin-bottom:8px">${f.statut === "PAYEE" ? "Modifier la date" : "Enregistrer le paiement"}</button></div>
      ${f.statut === "PAYEE" ? `<button class="btn texte erreur-t" id="annuler-paiement">Annuler le paiement</button>` : ""}
      ${!e.franchiseTva && f.ttc !== f.ht ? `<div class="section">Déclaration de TVA</div>
        <p class="note ${f.jourDeclarationTva ? "ok" : ""}">${f.jourDeclarationTva ? "TVA déclarée le " + jourCourt(f.jourDeclarationTva) : `TVA de ${euros(f.ttc - f.ht)} non encore déclarée`}</p>
        <div class="deux" style="align-items:end"><label class="champ"><span>Date de déclaration</span><input type="date" id="date-declaration" min="${f.jourEmission}" value="${f.jourDeclarationTva || isoJour()}"></label>
          <button class="btn contour" id="declarer" style="margin-bottom:8px">${f.jourDeclarationTva ? "Modifier" : "Enregistrer"}</button></div>
        ${f.jourDeclarationTva ? `<button class="btn texte erreur-t" id="annuler-declaration">Annuler la déclaration</button>` : ""}` : ""}`}`);

  if (brouillon) {
    $$("[data-l]").forEach(d => d.onclick = () => ouvrir(() => ecranLigne(D.lignes.find(l => l.id === d.dataset.l), f)));
    $("#ligne-libre").onclick = () => ouvrir(() => ecranLigne(null, f));
    $("#annexe").onchange = ev => { f.avecAnnexe = ev.target.checked; sauver(); };
    $("#emettre").onclick = async ev => {
      const b = ev.currentTarget, p = controler(f);
      if (p.length) { $("#controle").innerHTML = `<div class="carte alerte"><div class="fort">Informations manquantes</div>${p.map(x => `<div class="petit">• ${echap(x)}</div>`).join("")}</div>`; return; }
      if (!b.dataset.arme) { b.dataset.arme = "1"; b.textContent = "Touchez à nouveau pour émettre : numéro définitif, plus de modification"; return; }
      b.disabled = true; b.innerHTML = `<span class="chargement"></span> Génération du PDF Factur-X…`;
      try { await emettre(f); toast("Facture " + f.numero + " émise"); rendre(); }
      catch (err) { console.error(err); toast("Échec de l’émission : " + err.message); rendre(); }
    };
    $("#suppr").onclick = ev => {
      const b = ev.currentTarget;
      if (!b.dataset.arme) { b.dataset.arme = "1"; b.textContent = "Touchez à nouveau pour supprimer (les temps redeviennent à facturer)"; return; }
      D.saisies.filter(s => s.factureId === f.id).forEach(s => { s.statut = "afacturer"; delete s.factureId; });
      D.lignes = D.lignes.filter(l => l.factureId !== f.id); D.factures = D.factures.filter(x => x.id !== f.id); sauver(); retour();
    };
  } else {
    const pdf = async () => { const b = await Fichiers.lire(f.pdf || "pdf-" + f.id); if (!b) toast("PDF introuvable sur cet appareil"); return b; };
    $("#partager").onclick = async () => { const b = await pdf(); if (b) partagerFichier(f.numero + ".pdf", b, "application/pdf"); };
    $("#telecharger").onclick = async () => { const b = await pdf(); if (b) enregistrerFichier(f.numero + ".pdf", b, "application/pdf"); };
    $("#payer").onclick = () => { const d = $("#date-paiement").value; if (!d || d < f.jourEmission) { toast("Date de paiement invalide"); return; } f.statut = "PAYEE"; f.jourPaiement = d; sauver(); toast("Paiement enregistré au " + jourCourt(d)); rendre(); };
    const ap = $("#annuler-paiement"); if (ap) ap.onclick = () => { f.statut = "EMISE"; delete f.jourPaiement; sauver(); rendre(); };
    const dc = $("#declarer"); if (dc) dc.onclick = () => { const d = $("#date-declaration").value; if (!d) return; f.jourDeclarationTva = d; sauver(); toast("Déclaration enregistrée"); rendre(); };
    const ad = $("#annuler-declaration"); if (ad) ad.onclick = () => { delete f.jourDeclarationTva; sauver(); rendre(); };
  }
}

// ------------------------------------------------------------ Ligne (brouillon)
function ecranLigne(l, f) {
  const e = D.emetteur;
  const v = l || { libelle: "", qteCent: 100, unite: "C62", prixCents: 0, tvaCent: e.franchiseTva ? 0 : e.tauxTvaCentiemes };
  const enregistrer = () => {
    const fm = $("#form"), q = versCentiemes(fm.qte.value), p = versCentiemes(fm.prix.value), t = e.franchiseTva ? 0 : versCentiemes(fm.tva.value);
    if (!fm.libelle.value.trim() || !q || q <= 0 || p === null || t === null) { toast("Vérifiez la désignation, la quantité et le prix"); return; }
    const o = l || { id: uid(), factureId: f.id, ordre: D.lignes.filter(x => x.factureId === f.id).length, missionId: null };
    Object.assign(o, { libelle: fm.libelle.value.trim(), qteCent: q, unite: fm.unite.value, prixCents: p, tvaCent: t });
    if (!l) D.lignes.push(o); recalculer(f); sauver(); retour();
  };
  barre(l ? "Modifier la ligne" : "Nouvelle ligne", { action: { libelle: "Enregistrer", faire: enregistrer } });
  vue(`<form id="form" onsubmit="return false">
    <label class="champ"><span>Désignation</span><textarea name="libelle">${echap(v.libelle)}</textarea></label>
    <div class="deux"><label class="champ"><span>Quantité</span><input name="qte" inputmode="decimal" value="${depuisCentiemes(v.qteCent)}"></label>
      <label class="champ"><span>Prix unitaire HT (€)</span><input name="prix" inputmode="decimal" value="${v.prixCents ? depuisCentiemes(v.prixCents) : ""}"></label></div>
    <div class="deux"><label class="champ"><span>Unité</span><select name="unite">${Object.entries(UNITES).map(([k, x]) => `<option value="${k}" ${v.unite === k ? "selected" : ""}>${x}</option>`).join("")}</select></label>
      ${e.franchiseTva ? "" : `<label class="champ"><span>TVA (%)</span><input name="tva" inputmode="decimal" value="${depuisCentiemes(v.tvaCent)}"></label>`}</div>
    <button class="btn large" type="button" id="enreg" style="margin-top:12px">Enregistrer</button>
    ${l ? `<button class="btn danger large" type="button" id="suppr" style="margin-top:10px">Retirer de la facture</button>` : ""}</form>`);
  $("#enreg").onclick = enregistrer;
  const s = $("#suppr"); if (s) s.onclick = () => {
    D.lignes = D.lignes.filter(x => x.id !== l.id);
    // ligne regroupant une mission : ses temps redeviennent à facturer
    if (l.missionId) D.saisies.filter(x => x.factureId === f.id && x.missionId === l.missionId).forEach(x => { x.statut = "afacturer"; delete x.factureId; });
    recalculer(f); sauver(); retour();
  };
}

/* ===== app-achats.js ===== */
/* Chronéo web – achats et frais, justificatifs, lecture automatique (OCR) */

const TAUX_TVA = [2000, 1000, 550, 210, 0];
const fournisseursConnus = () => {
  const n = new Map();
  D.achats.forEach(a => { const k = (a.fournisseur || "").trim(); if (k) n.set(k.toLowerCase(), { nom: k, n: (n.get(k.toLowerCase())?.n || 0) + 1, j: a.jour }); });
  return [...n.values()].sort((a, b) => b.n - a.n || b.j.localeCompare(a.j)).map(x => x.nom);
};

// ------------------------------------------------------------ Liste
function rendreAchats() {
  barre("Achats et frais", { principal: true });
  const an = new Date().getFullYear(), duAn = D.achats.filter(a => a.jour.startsWith(String(an))).map(montantsAchat);
  const tri = D.achats.slice().sort((a, b) => b.jour.localeCompare(a.jour));

// ------------------------------------------------------------ Lecture automatique (OCR) : bibliothèques chargées à la demande
const chargerScript = src => new Promise((ok, ko) => { if ([...document.scripts].some(s => s.src === src)) return ok(); const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => ko(new Error("chargement impossible (connexion ?)")); document.head.appendChild(s); });
async function imagePourOcr(blob) {
  if (blob.type.includes("pdf")) {
    await chargerScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise, page = await doc.getPage(1);
    const v = page.getViewport({ scale: 2000 / Math.max(page.view[2], page.view[3]) }), cv = document.createElement("canvas");
    cv.width = v.width; cv.height = v.height; const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext: ctx, viewport: v }).promise; return cv;
  }
  return blob;
}
async function lireJustificatif(blob) {
  await chargerScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
  const image = await imagePourOcr(blob);
  const { data } = await Tesseract.recognize(image, "fra");
  return AnalyseJustificatif.analyser(data.text || "", fournisseursConnus());
}

const BILAN = { annee: new Date().getFullYear(), moisCa: new Date().getMonth(), moisCumul: new Date().getMonth(), moisTva: new Date().getMonth(), moisTvaCumul: new Date().getMonth() };

function rendreBilan() {

  const e = D.emetteur, franchise = e.franchiseTva, debits = e.tvaSurDebits;

  const emises = D.factures.filter(f => f.statut !== "BROUILLON");
  const mois = (iso, a = an) => iso && iso.startsWith(a + "-") ? Number(iso.slice(5, 7)) - 1 : null;

  // CA : facturé (factures Chronéo + temps facturés dans l'ancien outil) / à facturer (temps non facturés)
  const caAnnee = a => {
    const fac = Array(12).fill(0), afac = Array(12).fill(0);
    emises.forEach(f => { const m = mois(f.jourEmission, a); if (m !== null) fac[m] += f.ht; });

    return [fac, afac];

  const realise = fac.map((v, i) => v + afac[i]), realiseP = facP.map((v, i) => v + afacP[i]);
  const reel = fac.reduce((a, b) => a + b, 0), aFacturer = afac.reduce((a, b) => a + b, 0);
  const reste = an !== anCourant ? 0 : D.missions.filter(m => !m.terminee && m.prevuCentJours > 0).reduce((t, m) => {
    const prevu = Math.round(m.prevuCentJours * base() / 100), fait = D.saisies.filter(s => s.missionId === m.id && statutDe(s) !== "nonfact").reduce((x, s) => x + s.minutes, 0);
    return t + Math.round(Math.max(0, prevu - fait) * tjmDe(m, client(m.clientId)) / base());
  }, 0);
  const previsionnel = reel + aFacturer + reste;
  const sansTjm = new Map();
  D.saisies.filter(s => statutDe(s) !== "nonfact" && s.jour.startsWith(an + "-") && !tjmSaisie(s)).forEach(s => { const k = mission(s.missionId)?.nom || "Sans mission"; sansTjm.set(k, (sansTjm.get(k) || 0) + s.minutes); });

  // TVA due / à recevoir / récupérable
  const tvaSur = ht => Math.round(ht * tauxTva / 10000);
  const tvaDue = Array(12).fill(0), tvaRec = Array(12).fill(0), tvaDed = Array(12).fill(0);
  emises.forEach(f => { const j = debits ? f.jourEmission : f.statut === "PAYEE" ? f.jourPaiement : null; const m = mois(j); if (m !== null) tvaDue[m] += f.ttc - f.ht; });
  D.saisies.forEach(s => { const m = mois(s.jour); if (m === null) return; if (statutDe(s) === "ancien") tvaDue[m] += tvaSur(valeur(s)); else if (statutDe(s) === "afacturer") tvaRec[m] += tvaSur(valeur(s)); });
  if (!debits) emises.filter(f => f.statut === "EMISE").forEach(f => { const m = mois(f.jourEmission); if (m !== null) tvaRec[m] += f.ttc - f.ht; });
  D.achats.forEach(a => { const m = mois(a.jour); if (m !== null) tvaDed[m] += montantsAchat(a).recup; });
  const somme = v => v.reduce((a, b) => a + b, 0), cumul = v => v.reduce((r, x, i) => (r.push((r[i - 1] || 0) + x), r), []);
  const dernier = an < anCourant ? 11 : an === anCourant ? moisCourant : -1;
  const coupe = v => cumul(v).map((x, i) => i <= dernier ? x : null);
  const exigibles = emises.filter(f => mois(debits ? f.jourEmission : f.statut === "PAYEE" ? f.jourPaiement : null) !== null);
  const declaree = exigibles.filter(f => f.jourDeclarationTva).reduce((t, f) => t + f.ttc - f.ht, 0), aDeclarer = exigibles.filter(f => !f.jourDeclarationTva).reduce((t, f) => t + f.ttc - f.ht, 0);

  const OR = "#FF8000", ORC = "rgba(255,128,0,.45)", NEUTRE = "var(--texte-2)";

  const vM = courbeAn[BILAN.moisCumul], pM = cumul(realiseP)[BILAN.moisCumul];
  const evol = vM !== null && pM > 0 ? (vM - pM) * 100 / pM : null;
  const cDue = coupe(tvaDue), cRec = coupe(tvaRec), cDed = coupe(tvaDed);

  vue(`<div class="periode" style="margin-top:10px"><button data-an="-1" aria-label="Année précédente">‹</button><div class="titre" style="font-size:24px">${an}</div><button data-an="1" aria-label="Année suivante" ${an > anCourant ? "disabled" : ""}>›</button></div>

    <div class="section">Chiffre d’affaires HT</div>
    <div class="carte">
